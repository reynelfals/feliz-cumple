  function doCd(path) {
    const parts = resolve(path || "~");
    const n = nodeAt(parts);
    if (!n) { print(`cd: ${path}: No such file or directory`, "err"); return; }
    if (n.locked) { print(`cd: ${path}: Permission denied (locked). Usa: unlock ${parts.at(-1)}`, "err"); return; }
    if (n.t !== "d") { print(`cd: ${path}: Not a directory`, "err"); return; }
    cwd = parts; updatePs();
  }
  function doLs(argv) {
    let long=false, all=false, path=".";
    for (const a of argv) {
      if (a.startsWith("-")) { if (a.includes("l")) long=true; if (a.includes("a")) all=true; }
      else path=a;
    }
    const parts = resolve(path);
    const n = nodeAt(parts);
    if (!n) { print(`ls: cannot access '${path}': No such file or directory`, "err"); return; }
    if (n.locked) { print(`${n.m}  1 root  root  0 ${n.d}  ${parts.at(-1)}  [LOCKED]`, "amber"); return; }
    if (n.t === "f") { print(parts.at(-1)); return; }
    let names = Object.keys(n.c);
    if (!all) names = names.filter(x => !x.startsWith("."));
    names.sort();
    if (!long) { print(names.map(nm => n.c[nm].locked ? nm+"🔒" : nm).join("  ")); return; }
    for (const nm of names) {
      const c = n.c[nm];
      const mark = c.locked ? " [LOCKED]" : (c.t==="d"?"/":"");
      print(`${c.m}  1 ${c.o.padEnd(6)} ${c.o.padEnd(6)} ${String((c.x||"").length).padStart(6)} ${c.d}  ${nm}${mark}`);
    }
  }
  function readFile(path) {
    const parts = resolve(path);
    const n = nodeAt(parts);
    if (!n) return { err: `cat: ${path}: No such file or directory` };
    if (n.locked) return { err: `cat: ${path}: Permission denied` };
    if (n.t === "d") return { err: `cat: ${path}: Is a directory` };
    return { text: n.x || "", node: n };
  }

  async function runPipeline(raw) {
    const stages = raw.split("|").map(s => s.trim());
    let data = null;
    for (let i=0;i<stages.length;i++) {
      const part = stages[i];
      const m = part.match(/^(\S+)(?:\s+([\s\S]*))?$/);
      const cmd = m[1].toLowerCase();
      const argv = m[2] ? m[2].match(/(?:[^\s"]+|"[^"]*")+/g).map(s=>s.replace(/^"|"$/g,"")) : [];
      if (i === 0) {
        if (cmd === "cat") {
          const r = readFile(argv[0]); if (r.err){ print(r.err,"err"); return; }
          data = r.text;
        } else if (cmd === "echo") { data = (m[2]||"") + "\n"; }
        else if (cmd === "ls") {
          // capture ls
          const bak = print; let buf="";
          // simpler: reimplement
          const parts = resolve(argv.filter(a=>!a.startsWith("-"))[0]||".");
          const n = nodeAt(parts);
          if (!n||n.t!=="d"){ print("ls failed","err"); return; }
          data = Object.keys(n.c).join("\n")+"\n";
        } else { print(`pipe: ${cmd} no soportado al inicio`, "err"); return; }
      } else {
        let lines = data.split("\n"); if (lines.at(-1)==="") lines.pop();
        if (cmd === "grep") {
          const re = new RegExp(argv[0] || "");
          lines = lines.filter(l => re.test(l));
        } else if (cmd === "sort") {
          const rn = argv.includes("-rn") || (argv.includes("-r") && argv.includes("-n"));
          const n = argv.includes("-n") || rn;
          if (rn || (argv.includes("-r") && argv.includes("-n"))) lines.sort((a,b)=>parseFloat(b)-parseFloat(a));
          else if (argv.includes("-r")) lines.sort().reverse();
          else if (n) lines.sort((a,b)=>parseFloat(a)-parseFloat(b));
          else lines.sort();
        } else if (cmd === "uniq") {
          if (argv.includes("-c")) {
            const counts = new Map();
            for (const l of lines) counts.set(l, (counts.get(l)||0)+1);
            lines = [...counts.entries()].map(([k,v]) => `${String(v).padStart(7)} ${k}`);
          } else {
            lines = lines.filter((l,i) => i===0 || l !== lines[i-1]);
          }
        } else if (cmd === "cut") {
          let d="\t", f=null;
          for (let j=0;j<argv.length;j++) {
            if (argv[j]==="-d") d=argv[++j].replace(/^'|'$/g,"");
            else if (argv[j].startsWith("-d")) d=argv[j].slice(2);
            else if (argv[j]==="-f") f=argv[++j];
            else if (argv[j].startsWith("-f")) f=argv[j].slice(2);
          }
          const fi = parseInt(f,10)-1;
          lines = lines.map(l => l.split(d)[fi] !== undefined ? l.split(d)[fi] : "");
        } else if (cmd === "head") {
          let n=10; if (argv[0]==="-n") n=parseInt(argv[1],10); else if (argv[0]?.startsWith("-")) n=parseInt(argv[0].slice(1),10);
          lines = lines.slice(0,n);
        } else if (cmd === "wc") {
          print(` ${lines.length} ${lines.join(" ").split(/\s+/).filter(Boolean).length} ${lines.join("\n").length}`);
          return;
        } else if (cmd === "cat") { /* noop */ }
        else { print(`pipe: ${cmd} no soportado`, "err"); return; }
        data = lines.join("\n") + (lines.length?"\n":"");
      }
    }
    if (data) print(data.endsWith("\n")?data.slice(0,-1):data);
  }

  function doHint(dir) {
    // hint for next locked stage or named
    let st = null;
    if (dir) st = GAME.stages.find(s => s.dir === dir);
    else {
      st = GAME.stages.find(s => s.dir && !unlocked.has(s.id) && unlocked.has(GAME.stages[GAME.stages.indexOf(s)-1]?.id));
    }
    if (!st) { print("No hay pistas pendientes. ¡Mira si ya llegaste al final!", "dim"); return; }
    const key = "_hint_"+st.id;
    const n = (doHint[key]||0);
    const h = st.hints[Math.min(n, st.hints.length-1)];
    doHint[key] = n+1;
    print(`pista (${Math.min(n+1,st.hints.length)}/${st.hints.length}) para '${st.dir}': ${h}`, "amber");
  }

  async function doUnlock(dir, answer) {
    if (!dir) { print("usage: unlock <carpeta> [respuesta]", "err"); return; }
    const st = GAME.stages.find(s => s.dir === dir);
    if (!st) { print(`unlock: '${dir}' no es una cerradura`, "err"); return; }
    if (unlocked.has(st.id)) { print("Ya está abierta.", "dim"); return; }
    const idx = GAME.stages.indexOf(st);
    if (idx>0 && !unlocked.has(GAME.stages[idx-1].id)) {
      print("Todavía no. Sigue el hilo de las pistas.", "err"); return;
    }
    // need prev key = previous stage's Ki
    const prevHex = idx===0 ? "" : stageKeys[GAME.stages[idx-1].id];
    if (idx>0 && !prevHex) { print("Error de cadena. Reinicia.", "err"); return; }

    let ans = answer;
    if (!ans) {
      print(st.q, "amber");
      print("respuesta: ", "dim");
      const a = await readAnswer();
      ans = a;
    }
    const denied = await checkDeny(prevHex, ans, st);
    if (denied) { print(denied, "err"); return; }
    const res = await unwrapKi(prevHex, ans, st);
    if (!res) { print("Nope. Prueba otra vez o 'hint'.", "err"); beep(120,0.1,"sawtooth",0.04); return; }
    stageKeys[st.id] = res.kiHex;
    unlocked.add(st.id);
    const payload = await decryptBlob(res.kiHex, st.blob);
    clearance = Math.max(clearance, payload.level || 0);
    // replace locked stub
    const home = nodeAt(["home","operator"]);
    if (home && home.c[dir]?.locked) delete home.c[dir];
    mountTree(["home","operator", dir], {}); // ensure dir
    // mount content inside dir
    const dirNode = nodeAt(["home","operator", dir]);
    if (dirNode) {
      dirNode.locked = false;
      dirNode.m = "drwxr-xr-x";
      dirNode.c = dirNode.c || {};
    }
    mountTree(["home","operator", dir], payload.content);
    if (payload.git) {
      // stash git data on the son_retozon dir if present
      const repo = nodeAt(["home","operator", dir, "son_retozon"]) || nodeAt(["home","operator","son_retozon"]);
      // actually git is on s3 content which has son_retozon; attach to that
    }
    // attach git commits to any .git parent
    attachGit(payload);
    addLockedStubs();
    print(`*** Cerradura abierta: ${dir}  ·  clearance → NIVEL ${clearance}${clearance>=3?" (ROOT)":""} ***`, "ok");
    beep(880,0.06); beep(1175,0.08);
    if (clearance >= GAME.fortaleza_min_level) {
      print(">>> FORTALEZA desbloqueada. Escribe: fortaleza", "amber");
    }
    if (payload.finale) {
      print("", "ok");
      const fel = payload.content["FELIZ_CUMPLEANOS.txt"];
      if (fel) print(fel.x, "ok");
    }
    updatePs();
  }
  function attachGit(payload) {
    if (!payload.git) return;
    function walk(node) {
      if (!node || typeof node !== "object") return;
      if (node.c) {
        if (node.c[".git"]) node._git = payload.git;
        for (const v of Object.values(node.c)) walk(v);
      }
    }
    walk(nodeAt(["home","operator"]));
  }

  // git fake
  function findRepo() {
    // walk cwd up for _git or .git
    let parts = cwd.slice();
    while (true) {
      const n = nodeAt(parts);
      if (n && n._git) return { node:n, commits:n._git, path:parts };
      if (n && n.c && n.c[".git"] && n._git) return { node:n, commits:n._git, path:parts };
      // also check if any child mount attached _git on son_retozon
      if (!parts.length) break;
      parts = parts.slice(0,-1);
    }
    // search under home
    function search(node) {
      if (!node||!node.c) return null;
      if (node._git) return node;
      for (const v of Object.values(node.c)) { const r=search(v); if(r) return r; }
      return null;
    }
    const s = search(nodeAt(["home","operator"]));
    return s ? { node:s, commits:s._git } : null;
  }

        retrato: "Hitchcock. Usted recuerda instintivamente Los treinta y nueve escalones.",
        puerta: "Puerta negra. (entrar negra)",
      }
    },
    juegos: {
      name: "la Sala de juegos",
      desc: "Una escalera detrás de cristal. Una inscripción. Un hilo de Ariadna en el suelo.",
      exits: { negra: "salon", escalera: "espejos" },
      things: {
        inscripcion: "\"Cuando hayas llegado casi al final, tendrás que regresar...\"",
        escalera: "¿Cuántos peldaños tiene la escalera? (abrir escalera con <n>)",
        hilo: "Varios kilómetros. (coger hilo)",
      }
    },
    espejos: {
      name: "el Cuarto de espejos",
      desc: "Todo refleja todo. Al fondo, una puerta opaca hacia la Bestia.",
      exits: { escalera: "juegos", bestia: "bestia" },
      things: {
        espejo: "Hay algo vivo detrás.",
        puerta: "Conduce al cerebro de la Bestia. (entrar bestia)",
      }
    },
    bestia: {
      name: "el Cerebro de la Bestia",
      desc: "Pulsos de luz. La Bestia (¿o la Fortaleza?) espera. Usted oye un latido que no es suyo.",
      exits: { espejos: "espejos" },
      things: {
        bestia: "Misteriosa. Temida. Matable — si trae la maza.",
      }
    },
  };

  function fortPrint(s) {
    const el = document.getElementById("fort-screen");
    fort.log.push(s);
    if (fort.log.length > 80) fort.log.shift();
    el.textContent = fort.log.join("\n");
    el.scrollTop = el.scrollHeight;
  }
  function fortLook() {
    const r = FORT_ROOMS[fort.room];
    fortPrint("");
    fortPrint("Usted se encuentra en " + r.name + ".");
    fortPrint(r.desc);
    fortPrint("Usted ve: " + Object.keys(r.things).join(", ") + ".");
    if (fort.inv.length) fortPrint("Sus pertenencias: " + fort.inv.join(", ") + ".");
    fortPrint("");
    fortPrint("¿Qué desea hacer?");
  }
  function fortNorm(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  }
  function fortHandle(line) {
    const raw = fortNorm(line);
    if (!raw) { fortPrint("¿Qué desea hacer?"); return; }
    if (raw === "salir" || raw === "abandonar" || raw === "terminar" || raw === "quit") {
      closeFortaleza("salida"); return;
    }
    if (raw === "ayuda" || raw === "help" || raw === "consejos") {
      fortPrint("Comandos: mirar [cosa], coger <cosa>, inventario, entrar <sitio>,");
      fortPrint("abrir <cosa> con <palabra>, matar <cosa>, porciento, salir.");
      fortPrint("Homenaje a Fortaleza de Merchise — minijuego original.");
      fortPrint("¿Qué desea hacer?"); return;
    }
    if (raw === "porciento" || raw === "%") {
      let p = 10;
      if (fort.flags.door) p += 20;
      if (fort.inv.includes("maza")) p += 15;
      if (fort.flags.stairs) p += 25;
      if (fort.room === "bestia") p += 15;
      if (fort.flags.won) p = 100;
      fortPrint("Progreso: " + p + "%");
      fortPrint("¿Qué desea hacer?"); return;
    }
    if (raw === "inventario" || raw === "i") {
      fortPrint(fort.inv.length ? ("Sus pertenencias son: " + fort.inv.join(", ") + ".") : "Usted no lleva nada consigo.");
      fortPrint("¿Qué desea hacer?"); return;
    }
    if (raw === "mirar" || raw === "look" || raw === "ver") { fortLook(); return; }
    let m;
    if ((m = raw.match(/^(?:mirar|ver|observar|leer)\s+(.+)$/))) {
      const r = FORT_ROOMS[fort.room];
      const key = Object.keys(r.things).find(k => m[1].includes(k));
      if (!key) { fortPrint("No existe \"" + m[1] + "\" en este lugar."); }
      else fortPrint(r.things[key]);
      fortPrint("¿Qué desea hacer?"); return;
    }
    if ((m = raw.match(/^(?:coger|tomar)\s+(.+)$/))) {
      const r = FORT_ROOMS[fort.room];
      if (m[1].includes("maza") && fort.room === "exterior" && !fort.inv.includes("maza")) {
        fort.inv.push("maza"); fortPrint("Ok."); delete r.things.maza;
      } else if (m[1].includes("hilo") && fort.room === "juegos" && !fort.inv.includes("hilo")) {
        fort.inv.push("hilo"); fortPrint("Ok."); delete r.things.hilo;
      } else fortPrint("Usted no puede cargar con eso.");
      fortPrint("¿Qué desea hacer?"); return;
    }
    if ((m = raw.match(/^(?:abrir)\s+(.+?)\s+con\s+(.+)$/))) {
      const obj = m[1], word = m[2].replace(/\s+/g,"");
      if (fort.room === "exterior" && obj.includes("puerta")) {
        if (word === "obvias" || word === "obvia") {
          fort.flags.door = true; fortPrint("Usted se arrodilla, levanta los brazos y dice: OBVIAS");
          fortPrint("Ok. La puerta cede. (entrar puerta)");
        } else fortPrint("\"" + m[2] + "\" no es la contraseña.");
      } else if (fort.room === "juegos" && obj.includes("escalera")) {
        if (word === "39" || word === "treintainueve" || word === "treintaynueve") {
          fort.flags.stairs = true; fortPrint("Usted ha descifrado el acertijo correctamente.");
          fortPrint("La escalera tiene 39 peldaños. (entrar escalera)");
        } else fortPrint("Esa no es la respuesta.");
      } else fortPrint("No puede hacer eso.");
      fortPrint("¿Qué desea hacer?"); return;
    }
    if ((m = raw.match(/^(?:entrar|ir|atravesar|cruzar)\s+(.+)$/))) {
      const r = FORT_ROOMS[fort.room];
      const destKey = Object.keys(r.exits).find(k => m[1].includes(k) || (k==="puerta" && m[1].includes("principal")));
      if (!destKey) { fortPrint("OUCH! Usted se ha golpeado las narices."); fortPrint("¿Qué desea hacer?"); return; }
      if (fort.room === "exterior" && destKey === "puerta" && !fort.flags.door) {
        fortPrint("Necesita unas palabras mágicas."); fortPrint("¿Qué desea hacer?"); return;
      }
      if (fort.room === "juegos" && destKey === "escalera" && !fort.flags.stairs) {
        fortPrint("Debe resolver este acertijo: ¿Cuántos peldaños tiene la escalera?");
        fortPrint("Trate: abrir escalera con <respuesta>"); fortPrint("¿Qué desea hacer?"); return;
      }
      fort.room = r.exits[destKey];
      fortPrint("Ok."); fortLook(); return;
    }
    if ((m = raw.match(/^(?:matar|asesinar)\s+(.+)$/))) {
      if (fort.room === "bestia" && m[1].includes("bestia")) {
        if (!fort.inv.includes("maza")) { fortPrint("Todos sus esfuerzos son en vano. Probablemente no esté usando el objeto indicado."); }
        else {
          fort.flags.won = true;
          fortPrint("AAAAARRRGGGGG!!!");
          fortPrint("CRASSSHHH!!!");
          fortPrint("");
          fortPrint("La Bestia cae. ¿Era la Bestia, o la Fortaleza?");
          fortPrint("Entre los restos hay un papelito perforado:");
          fortPrint("");
          fortPrint("  \"En las gradas de Industriales, el grito que más");
          fortPrint("   se repite abre la oficina del manager.\"");
          fortPrint("");
          fortPrint("  *** 100% — homenaje a Fortaleza de Merchise ***");
          fortPrint("  (Miguel Cepero / Merchise, UCLV, ~1991)");
          fortPrint("");
          // drop clue into FS
          const home = nodeAt(["home","operator"]);
          if (home) {
            home.c["bestia_papel.txt"] = { t:"f", m:"-rw-r--r--", o:"operator", d:"Oct 19 21:03",
              x:"En las gradas de Industriales, el grito que más se repite abre la oficina del manager.\n(Homenaje a Fortaleza de Merchise — lo ganaste tú.)\n" };
          }
          fortPrint("Escribe SALIR para volver a BDAY-OS. (se guardó ~/bestia_papel.txt)");
        }
      } else fortPrint("¿Por qué hizo eso? No era necesario matarle.");
      fortPrint("¿Qué desea hacer?"); return;
    }
    fortPrint("No le comprendo.");
    fortPrint("¿Qué desea hacer?");
  }
  function closeFortaleza(why) {
    document.getElementById("dosbox-overlay").classList.remove("on");
    fort = null; phase = "shell"; updatePs();
    print(why === "win" || (why!=="salida") ? "[fortaleza] cerrado." : "[fortaleza] cerrado. ¿Mataste a la Bestia?", "dim");
    cmdEl.onkeydown = window.__shellKeyFinal || shellKey;
  }
  async function runFortaleza() {
    if (clearance < GAME.fortaleza_min_level) {
      print(`fortaleza: Permission denied. Clearance ${clearance} < ${GAME.fortaleza_min_level}`, "err");
      print("Sigue abriendo cerraduras, operador.", "dim"); return;
    }
    print("Cargando FORTALEZA.EXE ...", "amber");
    print("FORTALEZA — homenaje a Merchise (minijuego original, sin binarios)", "ok");
    const ov = document.getElementById("dosbox-overlay");
    ov.classList.add("on");
    fort = { room:"exterior", inv:[], flags:{}, log:[] };
    document.getElementById("dos-close").onclick = () => closeFortaleza("salida");
    fortPrint("════════════════════════════════════════");
    fortPrint("   Merchise Software  y  [[]] presentan");
    fortPrint("════════════════════════════════════════");
    fortPrint("     F O R T A L E Z A");
    fortPrint("   (homenaje · ~5 min · BDAY-OS)");
    fortPrint("");
    fortPrint("Su misión: adentrarse en la Fortaleza y");
    fortPrint("matar a la Bestia. Nada más.");
    fortPrint("");
    fortPrint("Escriba AYUDA para comandos. SALIR para salir.");
    fortLook();
    phase = "fortaleza";
    psEl.textContent = ">";
    cmdEl.onkeydown = function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        const line = cmdEl.value; cmdEl.value = "";
        fortPrint("> " + line);
        fortHandle(line);
        if (fort && fort.flags.won) { /* stay until SALIR */ }
      }
      if (e.key === "c" && e.ctrlKey) { e.preventDefault(); closeFortaleza("salida"); }
    };
  }

  // strings command quick
  // already handled via node.strings in run

  // ---------- input ----------
  function shellKey(e) {
    if (phase === "login") {
      if (e.key === "Enter") {
        e.preventDefault();
        const pw = cmdEl.value; cmdEl.value="";
        print("(auth...)", "dim");
        tryLogin(pw);
      }
      return;
    }
    if (e.key === "c" && e.ctrlKey) {
      e.preventDefault(); print("^C", "dim"); cmdEl.value=""; return;
    }
    if (e.key === "l" && e.ctrlKey) {
      e.preventDefault(); outEl.textContent=""; return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      if (!history.length) return;
      histIdx = histIdx < 0 ? history.length-1 : Math.max(0, histIdx-1);
      cmdEl.value = history[histIdx]; return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (histIdx < 0) return;
      histIdx++;
      if (histIdx >= history.length) { histIdx=-1; cmdEl.value=""; }
      else cmdEl.value = history[histIdx];
      return;
    }
    if (e.key === "Tab") {
      e.preventDefault();
      // crude completion: files in cwd + commands
      const cur = cmdEl.value;
      const bits = cur.split(/\s+/);
      const partial = bits[bits.length-1] || "";
      const n = nodeAt(cwd);
      const names = n && n.c ? Object.keys(n.c) : [];
      const cmds = ["ls","cd","cat","unlock","hint","git","fortaleza","man","help","vim","grep","clear","id","status"];
      const pool = (bits.length<=1 ? cmds : names).filter(x => x.startsWith(partial));
      if (pool.length === 1) {
        bits[bits.length-1] = pool[0];
        cmdEl.value = bits.join(" ") + (bits.length===1 || names.includes(pool[0]) ? (nodeAt(resolve(pool[0]))?.t==="d"?"/":" ") : " ");
      } else if (pool.length > 1) { print(pool.join("  "), "dim"); }
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      const line = cmdEl.value;
      if (vimMode) {
        print((psEl.textContent.startsWith(":") ? ":" : "") + line);
        cmdEl.value=""; vimHandle(line.startsWith(":")?line:":"+line); // allow q! without colon if already in cmd mode
        // actually user types :q! into cmd; ps shows :
        return;
      }
      print(psEl.textContent + line);
      cmdEl.value = "";
      if (line.trim()) history.push(line);
      histIdx = -1;
      Promise.resolve(runLine(line)).then(updatePs);
    }
  }
  // fix vim enter: when vimMode, ps is ":" and user types q!
  cmdEl.onkeydown = shellKey;
  document.addEventListener("click", () => cmdEl.focus());

  // Patch mount to attach git from stage payloads
  const origUnlock = doUnlock;
  // attachGit already defined — also set _git on repo dir with .git when mounting s3 content
  // Fix findRepo: after s3 unlock, content has son_retozon/.git — attachGit walks and sets _git on nodes that have .git child. Good.

  // Fix readAnswer to show the typed answer (not mask) — already does.
  // Fix strings: add command
  const _runLine = runLine;
  // wrap runLine for strings + ./estadio_login
  window.__run = runLine;

  // override runLine assignment — add strings
  const realRun = runLine;
  async function runLine2(line) {
    const t = line.trim();
    if (t.startsWith("strings ")) {
      const path = t.slice(8).trim();
      const r = readFile(path);
      if (r.err) { print(r.err,"err"); return; }
      if (r.node && r.node.strings) { print(r.node.strings); return; }
      print(r.text);
      return;
    }
    if (t === "./estadio_login" || t.endsWith("/estadio_login")) return runSqli();
    return realRun(line);
  }
  // rebind
  cmdEl.onkeydown = function(e) {
    if (phase==="login") return shellKey(e);
    if (e.key==="Enter") {
      e.preventDefault();
      const line = cmdEl.value;
      if (vimMode) {
        print(":" + line, "dim");
        cmdEl.value="";
        const cmd = line.startsWith(":") ? line : ":" + line;
        vimHandle(cmd);
        return;
      }
      print(psEl.textContent + line);
      cmdEl.value="";
      if (line.trim()) history.push(line);
      histIdx=-1;
      Promise.resolve(runLine2(line)).then(updatePs);
      return;
    }
    shellKey(e);
  };

  boot();
})();
</script>
