// tokens: {v, q}  (q = was quoted)
function tokenize(s) {
  const out = []; let cur = "", q = null, has = false, quoted = false;
  for (let i = 0; i < s.length; i++) {
    let ch = s[i];
    if (q) { if (ch === q || (q === '"' && (ch === "“" || ch === "”")) || (q === "'" && (ch === "‘" || ch === "’"))) q = null; else cur += ch; continue; }
    if (ch === "“" || ch === "”") ch = '"';
    if (ch === "‘" || ch === "’") ch = "'";
    if (ch === '"' || ch === "'") { q = ch; has = true; quoted = true; continue; }
    if (/\s/.test(ch)) { if (cur || has) { out.push({ v: cur, q: quoted }); cur = ""; has = false; quoted = false; } continue; }
    cur += ch; has = true;
  }
  if (cur || has) out.push({ v: cur, q: quoted });
  return out;
}
function splitPipes(s) {
  const parts = []; let cur = "", q = null;
  for (const ch of s) {
    if (q) { if (ch === q || ch === "”" || ch === "’") q = null; cur += ch; continue; }
    if (ch === '"' || ch === "'" || ch === "“" || ch === "‘") { q = ch === "“" ? '"' : ch === "‘" ? "'" : ch; cur += ch; continue; }
    if (ch === "|") { parts.push(cur); cur = ""; continue; }
    cur += ch;
  }
  parts.push(cur);
  return parts.map(p => p.trim());
}
// pull "< file", "> file", ">> file" out of a segment (outside quotes)
function redirections(seg) {
  let out = "", q = null, rin = null, rout = null, app = false;
  for (let i = 0; i < seg.length; i++) {
    const ch = seg[i];
    if (q) { if (ch === q) q = null; out += ch; continue; }
    if (ch === '"' || ch === "'") { q = ch; out += ch; continue; }
    if (ch === "<" || ch === ">") {
      let j = i + 1; let ap = false;
      if (ch === ">" && seg[j] === ">") { ap = true; j++; }
      while (seg[j] === " ") j++;
      let k = j; while (k < seg.length && !/[\s<>|]/.test(seg[k])) k++;
      const target = seg.slice(j, k);
      if (ch === "<") rin = target; else { rout = target; app = ap; }
      i = k - 1; continue;
    }
    out += ch;
  }
  return { seg: out.trim(), rin, rout, app };
}

function readArg(path, cmd) {

// ---------------------------------------------------------------- DIR
function dirCmd(a) {
  let wide = false, page = false, showA = false, bare = false, pathArg = "";
  for (const t of a) {
    const v = t.v, up = v.toUpperCase();
    if (up.startsWith("/")) {
      for (const ch of up.slice(1)) {
        if (ch === "W") wide = true; else if (ch === "P") page = true; else if (ch === "A") showA = true;
        else if (ch === "B") bare = true;
      }
    } else if (!pathArg) pathArg = v;
  }
  let dirDrive = drive, dirParts, pattern = "*.*";
  if (!pathArg) { dirParts = cwd.slice(); dirDrive = drive; }
  else {
    const lastSeg = pathArg.split(/[\\\/:]/).pop();
    const looksLikeFile = isWild(pathArg) || (lastSeg.includes(".") && !/^\.+$/.test(lastSeg));
    if (looksLikeFile) {
      const slash = Math.max(pathArg.lastIndexOf("\\"), pathArg.lastIndexOf("/"));
      pattern = (slash >= 0 ? pathArg.slice(slash + 1) : pathArg).toUpperCase();
      const dp = slash >= 0 ? pathArg.slice(0, slash) || "\\" : "";
      const rr = mustResolve(dp === "" ? "." : dp); if (rr.err) return { err: rr.err }; dirParts = rr.parts; dirDrive = rr.drive;
    } else { const rr = mustResolve(pathArg); if (rr.err) return { err: rr.err }; dirParts = rr.parts; dirDrive = rr.drive; }
  }
  const n = nodeAt(dirParts, dirDrive);
  if (!n) return { err: "File not found" };
  if (n.locked) return { err: "Access denied" };
  if (n.t !== "d") return { err: "File not found" };
  const re = wildRe(pattern);
  let names = Object.keys(n.c).filter(nm => re.test(nm)).sort((x, y) => {
    const xd = n.c[x].t === "d", yd = n.c[y].t === "d";
    if (xd !== yd) return xd ? -1 : 1;
    return x.localeCompare(y);
  });
  if (!showA) names = names.filter(nm => !n.c[nm].h && !n.c[nm].s);
  if (!names.length && pattern !== "*.*") return { err: "File not found" };
  if (bare) return { out: joinL(names), page };
  let o = ` Volume in drive ${dirDrive} is ${volLabel(dirDrive)}\n Directory of ${dosPath(dirParts, dirDrive)}\n\n`;
  const rows = [];
  for (const nm of names) {
    const c = n.c[nm];
    const [base, ext] = nm.includes(".") ? (() => { const i = nm.lastIndexOf("."); return [nm.slice(0, i), nm.slice(i + 1)]; })() : [nm, ""];
    const attrs = (c.h ? "H" : "") + (c.s ? "S" : "") + (c.r ? "R" : "") + (c.locked ? "L" : "");
    if (wide) {
      rows.push((c.t === "d" ? "[" + nm + "]" : nm).padEnd(13) + (c.locked ? "🔒" : ""));
    } else {
      const size = c.t === "d" ? "        <DIR>" : String(fileSize(c)).padStart(13);
      const tag = c.locked ? "  [LOCKED]" : (attrs ? "  " + attrs : "");
      o += `${base.padEnd(8)} ${ext.padEnd(3)} ${size} ${c.d || DOSDATE}${tag}\n`;
    }
  }
  if (wide) {
    for (let i = 0; i < rows.length; i += 5) o += rows.slice(i, i + 5).join(" ") + "\n";
  }
  const shown = names.length;
  const bytes = names.reduce((s, nm) => s + (n.c[nm].t === "f" ? fileSize(n.c[nm]) : 0), 0);
  o += `       ${String(shown).padStart(2)} file(s) ${fmtNum(bytes).padStart(14)} bytes\n`;
  o += `                      ${fmtNum(Math.max(0, FLOPPY - bytesUsed(dirDrive))).padStart(14)} bytes free\n`;
  return { out: o, page };
}

function pipeXor(a, stdin) {

  const key = rest[rest.length - 1];

  return { out: s + "\n" };
}

    if (m && m[0].length >= 16) { let h = m.sort ? m.sort((x, y) => y.length - x.length)[0] : m[0]; if (h.length % 2) h = h.slice(0, -1); bytes = hexToBuf(h); }

function debugLine(line) {
  const t = line.trim().toUpperCase();
  if (!t || t === "Q" || t === "QUIT") { debug = null; mode = "shell"; setPrompt(shellPrompt()); return; }
  if (t.startsWith("D") || t === "") {
    const arg = (t.match(/^D\s*([0-9A-F]+)?/) || [])[1];
    const start = arg ? parseInt(arg, 16) : debug.ptr;          // ptr is a number, not a hex string
    if (start >= debug.bytes.length) {
      print(`(fin del archivo: ${debug.bytes.length} bytes = ${debug.bytes.length.toString(16).toUpperCase()}h — Q para salir, D 0 vuelve al inicio)`, "dim");
      setPrompt("-"); return;
    }
    let o = "";
    for (let row = 0; row < 8; row++) {
      const off = start + row * 16;
      if (off >= debug.bytes.length) break;
      let hex = "", asc = "";
      for (let i = 0; i < 16; i++) {
        const b = debug.bytes[off + i];
        if (b === undefined) { hex += "   "; asc += " "; }
        else { hex += b.toString(16).padStart(2, "0").toUpperCase() + (i === 7 ? "-" : " "); asc += (b >= 32 && b < 127) ? String.fromCharCode(b) : "."; }
      }
      o += (off & 0xFFFF).toString(16).padStart(4, "0").toUpperCase() + "  " + hex + " " + asc + "\n";
    }
    debug.ptr = start + 128;
    print(o.replace(/\n$/, ""));
  } else if (t.startsWith("?")) {
    print("DEBUG: D [addr hex] = dump 128 bytes (D otra vez = siguiente página) · Q = quit");
  } else print("Error");
  setPrompt("-");
}

async function pageText(text) {
  const L = lines(text);
  const page = 23;
  if (L.length <= page) { print(text.replace(/\n$/, "")); return; }
  for (let i = 0; i < L.length; i += page) {

// ---------------------------------------------------------------- PATH / basename command resolution
function cmdBasename(raw) {
  let s = String(raw).replace(/\//g, "\\");
  // strip drive "A:"
  const dm = s.match(/^[a-zA-Z]:(.*)$/);
  if (dm) s = dm[1] || "";
  const i = s.lastIndexOf("\\");
  let base = (i >= 0 ? s.slice(i + 1) : s);
  return base.toUpperCase().replace(/\.(EXE|COM|BAT)$/i, "");
}
function findOnPath(name, opts) {
  opts = opts || {};
  name = String(name).toUpperCase().replace(/\.(EXE|COM|BAT)$/i, "");
  const tryNames = [name + ".COM", name + ".EXE", name + ".BAT", name];
  if (name === "EDIT" || name === "EDITOR") tryNames.push("EDITOR.COM", "EDIT.COM");
  const dirs = [];
  if (!opts.skipCwd) dirs.push({ drive, parts: cwd.slice() });
  for (const p of (env.PATH || "").split(";")) {
    if (!p) continue;
    const r = resolve(p);
    if (r && !r.nodisk) dirs.push({ drive: r.drive, parts: r.parts });
  }
  if (diskIn.B) dirs.push({ drive: "B", parts: [] });
  let fallback = null; // file without usable .run (e.g. compiled stub) — only if nothing better
  for (const d of dirs) {
    const n = nodeAt(d.parts, d.drive); if (!n || n.t !== "d") continue;
    for (const tn of tryNames) {
      const f = n.c[tn];
      if (!f || f.t !== "f") continue;
      const hit = { parts: d.parts.concat(tn), node: f, name: tn, drive: d.drive };
      if (f.run && f.run !== "compiled") return hit; // real tool wins
      if (f.run && !fallback) fallback = hit;
    }
  }
  return fallback;
}
/** Resolve a command token (bare, relative, absolute, any case, with/without .EXE/.COM). */
function resolveCommand(rawCmd) {
  const base = cmdBasename(rawCmd);
  if (!base) return null;
  // 1) PATH / B: builtins by basename — wins over path-local .PAS stubs / compiled .COM
  const sys = findOnPath(base, { skipCwd: true });
  if (sys && sys.node.run && sys.node.run !== "compiled") return sys;
  // 2) Explicit path: resolve file at that location (ESTADIO in MARIETA, B:\FORTALEZ)
  const pathy = /[\\\/]/.test(rawCmd) || (/^[a-zA-Z]:/.test(rawCmd) && !/^[a-zA-Z]:$/i.test(rawCmd));
  if (pathy) {
    let r = mustResolve(rawCmd);
    if (r.nodisk) return { nodisk: r.nodisk };
    if (!r.err) {
      let n = nodeAt(r.parts, r.drive);
      if (!n && !/\.(COM|EXE|BAT)$/i.test(rawCmd)) {
        for (const ext of [".COM", ".EXE", ".BAT"]) {
          const r2 = mustResolve(rawCmd + ext);
          if (!r2.err) { const n2 = nodeAt(r2.parts, r2.drive); if (n2) { r = r2; n = n2; break; } }
        }
      }
      if (n && n.t === "f" && n.run) return { parts: r.parts, node: n, name: r.parts[r.parts.length - 1], drive: r.drive };
      if (n && n.t === "f" && /\.PAS$/i.test(r.parts[r.parts.length - 1]))
        return { pasOnly: r.parts[r.parts.length - 1] };
      if (n && n.t === "f") return { parts: r.parts, node: n, name: r.parts[r.parts.length - 1], drive: r.drive };
    }
  }
  // 3) cwd then PATH (.COM/.EXE after TPC, ESTADIO when cwd=MARIETA)
  const hit = findOnPath(base);
  if (hit) return hit;
  // bare Name.PAS (source without .EXE) — nudge to TPC
  if (/\.PAS$/i.test(String(rawCmd))) {
    const r = mustResolve(rawCmd);
    if (!r.err) {
      const n = nodeAt(r.parts, r.drive);
      if (n && n.t === "f") return { pasOnly: r.parts[r.parts.length - 1] };
    }
  }
  return null;
}

// one square-wave blip: f -> f2 (optional slide), d seconds, starting `at` seconds from now
function batTone(c, f, d, at = 0, f2 = 0, g = 0.07, type = "square") {
  const t = c.currentTime + at;
  const o = c.createOscillator(), v = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  v.gain.setValueAtTime(0.0001, t);
  v.gain.exponentialRampToValueAtTime(g, t + 0.005);
  v.gain.setValueAtTime(g, t + Math.max(0.006, d * 0.6));
  v.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(v); v.connect(c.destination);
  o.start(t); o.stop(t + d + 0.02);
}
// short white-noise burst (bat crack); falls back to a sharp high click
function batNoise(c, d, at = 0, g = 0.09) {
  const t = c.currentTime + at;
  try {
    const n = Math.max(1, Math.floor(c.sampleRate * d));
    const buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(), v = c.createGain();
    src.buffer = buf; v.gain.setValueAtTime(g, t);
    src.connect(v); v.connect(c.destination); src.start(t);
  } catch (e) { batTone(c, 2400, 0.02, at, 1800, g); }
}

function batgameApplyMercy() {
  if (!batgame || batgame.mercy) return;
  if (batgame.fails < 4) return;
  batgame.mercy = true;
  batgame.need = 2;
  batgame.msg = "MODO PRÁCTICA — más fácil. 2 cuadrangulares bastan.";

}

function batgameNextPitch() {
  if (!batgame) return;
  batgameApplyMercy();
  if (batgame.hit >= batgame.need) return batgameWin();
  if (batgame.pitch >= batgame.pitches) {
    batgame.msg = "Fin del inning — inténtalo de nuevo (SPACE)";
    batgame.phase = "ready";
    batgame.pitch = 0; batgame.hit = 0;
    batgame.fails++;
    batSfx("inning");
    batgameDraw();
    return;
  }
  batgame.pitch++;
  batgame.phase = "flying";
  batgame.swinging = false;
  batgame.t0 = performance.now();
  // sweet spot ~55–72% of flight; mercy widens
  const flight = batgame.mercy ? 1400 : 1000;
  batgame.flight = flight;
  batgame.sweet0 = batgame.mercy ? 0.40 : 0.52;
  batgame.sweet1 = batgame.mercy ? 0.85 : 0.72;
  cancelAnimationFrame(batgame.raf);
  const tick = (now) => {
    if (!batgame || batgame.phase !== "flying") return;
    batgame.state = Math.min(1, (now - batgame.t0) / batgame.flight);
    batgameDraw();
    if (batgame.state >= 1) {
      // missed
      batgame.phase = "result";
      batgame.msg = "STRIKE — swing más temprano (SPACE)";
      batgame.fails++;
      batSfx("strike");
      setTimeout(() => { if (batgame) batgameNextPitch(); }, 700);
      return;
    }
    batgame.raf = requestAnimationFrame(tick);
  };
  batgame.raf = requestAnimationFrame(tick);
  batSfx("pitch");
}

function batgameSwing() {
  if (!batgame) return;
  if (batgame.phase === "ready") { batgameNextPitch(); return; }
  if (batgame.phase !== "flying" || batgame.swinging) return;
  batgame.swinging = true;
  const st = batgame.state;
  cancelAnimationFrame(batgame.raf);
  const ok = st >= batgame.sweet0 && st <= batgame.sweet1;
  batgame.phase = "result";
  if (ok) {
    batgame.hit++;
    batgame.msg = `¡CUADRANGULAR! ${batgame.hit}/${batgame.need}   (pitch ${batgame.pitch}/${batgame.pitches})`;
    batSfx("crack"); batSfx("run"); batSfx("cuadra");
  } else {
    batgame.fails++;
    batgame.msg = st < batgame.sweet0 ? "Muy temprano" : "Muy tarde";
    // just outside the zone: you nick it foul; otherwise pure air (sound only — same outcome)
    const near = Math.min(Math.abs(st - batgame.sweet0), Math.abs(st - batgame.sweet1)) < 0.06;
    batSfx(near ? "foul" : "swing");
  }
  batgameDraw();
  setTimeout(() => { if (batgame) batgameNextPitch(); }, ok ? 650 : 750);
}

async function batgameWin() {
  if (!batgame) return;
  batgame.phase = "done";
  batgame.msg = "¡GANASTE! Desbloqueando DIAMANTE…";
  batSfx("win");
  batgameDraw();
  const ans = batgameAnswer();
  const st = GAME.stages.find(s => s.id === "s8");
  const prev = GAME.stages[GAME.stages.indexOf(st) - 1];
  let res = null;
  try { res = await tryAnswer(keys[prev.id], ans, st); } catch (e) { res = null; }
  const code = ans; // show after unlock path — printed as clave
  await sleep(400);
  batgameQuit(true);
  if (!res) {
    print("BEISBOL: victoria, pero el candado no respondió. Prueba UNLOCK DIAMANTE a mano.", "err");
    print("(la clave es lo que conectaste con el bate — 6 letras)", "dim");
    return;
  }
  if (!solved.has("s8")) {
    const payload = await openBlob(res.ki, st);
    keys[st.id] = res.ki; solved.add(st.id);
    mountPayload(st, payload);
    saveProgress();
  }
  for (const ln of dosBox(["BEISBOL.EXE - INDUSTRIALES GANAN", "CLAVE DEL DIAMANTE:  " + code.toUpperCase()], 34)) print(ln, "hi");
  print("✓ ACCESO CONCEDIDO: DIAMANTE\\", "hi");
  showProgress();
  print("(prueba: CD A:\\NONAME\\DIAMANTE & TYPE LEEME.TXT)", "dim");
}

function batgameForceWin() {
  if (!batgame) return;
  batgame.hit = batgame.need;
  batgameWin();
}

function batgameQuit(won) {
  if (!batgame) return;
  cancelAnimationFrame(batgame.raf);
  const canvas = batgame.canvas;
  canvas.removeEventListener("pointerdown", batgame._swing);
  document.removeEventListener("keydown", batgame._key);
  window.removeEventListener("resize", resizeBatgame);
  const sndEl = $("bat-snd");
  if (sndEl && batgame._snd) sndEl.removeEventListener("pointerdown", batgame._snd);
  if (!won) batSfx("lose");
  $("batgame").classList.remove("on");
  document.body.classList.remove("appmode");
  batgame = null;
  mode = "shell";
  if (!won) print("[BEISBOL] Abandonas el diamante. Santiago se ríe.", "dim");
  setPrompt(shellPrompt());
  delete window.__batgameAutoWin;
  delete window.__batgameMercy;
}

// ---------------------------------------------------------------- Tab completion (optional, DOS-style)
function complete() {
  const v = cmdEl.value, pos = cmdEl.selectionStart ?? v.length;
  const left = v.slice(0, pos), right = v.slice(pos);
  const word = left.match(/(\S*)$/)[1], before = left.slice(0, left.length - word.length);
  const isCmd = !before.trim() || /\|\s*$/.test(before) || /\s+&\s*$/.test(before);
  let cands = [];
  const CMDS = ["DIR","CD","TYPE","MORE","FIND","SORT","CLS","VER","MEM","ECHO","SET","PATH","ATTRIB","EDITOR","EDIT","DEBUG",
    "HELP","UNLOCK","HINT","STATUS","COPY","DEL","PKUNZIP","FORTALEZ","TREE","VOL","DOSKEY","TURBO","TPC","BEISBOL","MAPA","PROGRESO","RESET","REBOOT","EXIT"];
  if (isCmd && !word.includes("\\") && !word.includes("/")) {
    cands = CMDS.filter(c => c.startsWith(word.toUpperCase())).map(c => c + " ");
  } else {
    const slash = Math.max(word.lastIndexOf("\\"), word.lastIndexOf("/"));
    const dirPart = slash >= 0 ? word.slice(0, slash + 1) : "";
    const prefix = (slash >= 0 ? word.slice(slash + 1) : word).toUpperCase();
    const rr = mustResolve(dirPart || ".");
    const dn = rr.err ? null : nodeAt(rr.parts, rr.drive);
    if (dn && dn.t === "d" && !dn.locked)
      cands = Object.keys(dn.c).filter(n => n.startsWith(prefix) && !dn.c[n].h)
        .sort().map(n => dirPart + n + (dn.c[n].t === "d" ? "\\" : " "));
  }
  const put = s => { cmdEl.value = before + s + right; const p = (before + s).length; cmdEl.setSelectionRange(p, p); };
  if (!cands.length) { beep(220, 0.03); return; }
  if (cands.length === 1) return put(cands[0]);
  let common = cands[0];
  for (const c of cands) while (!c.startsWith(common)) common = common.slice(0, -1);
  if (common.length > word.length) return put(common);
  print(psEl.textContent + v);
  print(cands.map(c => c.trimEnd()).join("   "), "dim");
}

// ---------------------------------------------------------------- input
async function submit() {
  const v = cmdEl.value;
  switch (mode) {
    case "boot": case "busy": case "more": return;
    case "login-user":
      cmdEl.value = ""; print(psEl.textContent + v);
      loginUser = v; mode = "login-pass"; setPrompt("Contraseña: ", true); return;
    case "login-pass":
      cmdEl.value = ""; print(psEl.textContent);
      return doLogin(loginUser, v);
    case "prompt": {
      cmdEl.value = "";
      print(psEl.textContent + (cmdEl.type === "password" ? "*".repeat(v.length) : v));
      const r = promptResolve; promptResolve = null; mode = "busy"; hidePrompt(); r(v); return;
    }
    case "edit": cmdEl.value = ""; return editLine(v);
    case "debug": cmdEl.value = ""; print("-" + v); return debugLine(v);
    case "fort": cmdEl.value = ""; return fortLine(v);
    case "shell": {
      cmdEl.value = "";
      if (echoOn) print(psEl.textContent + v);
      if (v.trim() && history[history.length - 1] !== v) { history.push(v); noteHistory(v); }
      histIdx = -1; draft = "";
      mode = "busy"; hidePrompt();
      try { await runLine(v); }
      catch (e) { console.error(e); print("BDAY-OS: error interno: " + e.message, "err"); }
      if (mode === "busy" || mode === "prompt") mode = "shell";
      if (mode === "shell") setPrompt(shellPrompt());
      saveSession();
      return;
    }
  }
}
function cancelLine() {
  if (mode === "prompt") {
    print(psEl.textContent + cmdEl.value + "^C", "dim"); cmdEl.value = "";
    const r = promptResolve; promptResolve = null; mode = "busy"; hidePrompt(); r(null); return;
  }
  if (mode === "more") { const r = promptResolve; promptResolve = null; if (r) r("q"); return; }
  if (mode === "edit") { cmdEl.value = ""; return; }
  if (mode === "debug") { cmdEl.value = ""; print("^C"); debug = null; mode = "shell"; setPrompt(shellPrompt()); return; }
  if (mode === "fort") { cmdEl.value = ""; return fortQuit("[FORTALEZ] ^C — Usted huye de la Fortaleza."); }
  if (mode === "shell" || mode === "login-user" || mode === "login-pass") {
    print(psEl.textContent + (mode === "login-pass" ? "" : cmdEl.value) + "^C"); cmdEl.value = ""; histIdx = -1;
    if (mode === "login-pass") { mode = "login-user"; setPrompt("Usuario: "); }
  }
}
cmdEl.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (mode === "boot") { skipBoot = true; return; }
  const k = e.key;
  // EDIT: keyboard File menu (Alt+F, hotkeys, arrows + Enter, Esc)
  if (mode === "edit" && editMenuKey(e)) return;
  if (e.ctrlKey && !e.altKey && (k === "c" || k === "C")) {
    if (cmdEl.selectionStart !== cmdEl.selectionEnd) return;
    e.preventDefault(); return cancelLine();
  }
  if (e.ctrlKey && !e.altKey && (k === "l" || k === "L")) { e.preventDefault(); if (mode === "shell") clearScreen(); return; }
  if (e.ctrlKey && !e.altKey && (k === "u" || k === "U")) { e.preventDefault(); cmdEl.value = ""; return; }
  if (k === "Escape") {
    e.preventDefault();
    if (mode === "edit") { $("filemenu").classList.remove("on"); $("editdlg").classList.remove("on"); }
    cmdEl.value = ""; histIdx = -1; draft = "";            // DOS: Esc cancels the current line
    return;
  }
  if (k === "Enter") { e.preventDefault(); return submit(); }
  if (k === "Tab") { e.preventDefault(); if (mode === "shell") complete(); return; }
  if (k === "F3" && mode === "shell") {
    e.preventDefault();
    if (history.length) { cmdEl.value = history[history.length - 1]; const end = cmdEl.value.length; cmdEl.setSelectionRange(end, end); }
    return;
  }
  if (mode === "shell" && (k === "ArrowUp" || k === "ArrowDown")) {
    e.preventDefault();
    if (!history.length) return;
    if (k === "ArrowUp") { if (histIdx === -1) { draft = cmdEl.value; histIdx = history.length - 1; } else if (histIdx > 0) histIdx--; }
    else { if (histIdx === -1) return; histIdx++; if (histIdx >= history.length) { histIdx = -1; cmdEl.value = draft; return; } }
    cmdEl.value = history[histIdx];
    const end = cmdEl.value.length; cmdEl.setSelectionRange(end, end);
    return;
  }
  if (k.length === 1 && !e.ctrlKey && !e.metaKey) click();
});
rowEl.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
async function ctrlAltDel() {
  if (mode !== "shell") { beep(140, 0.08, "sawtooth", 0.03); return; }
  cmdEl.value = ""; print(psEl.textContent + "<Ctrl+Alt+Supr>", "dim");
  mode = "busy"; hidePrompt();
  await cmdReboot();
  if (mode === "busy" || mode === "prompt") { mode = "shell"; setPrompt(shellPrompt()); }
}
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.altKey && (e.key === "Delete" || e.key === "Del")) { e.preventDefault(); ctrlAltDel(); return; }
  if (mode === "boot") { skipBoot = true; return; }
  if (document.activeElement !== cmdEl && !e.metaKey && !e.ctrlKey && !e.altKey) focusInput();
});
document.addEventListener("pointerdown", () => { if (mode === "boot") skipBoot = true; });
let touchXY = null;
document.addEventListener("touchstart", (e) => { const t = e.touches[0]; touchXY = t ? [t.clientX, t.clientY] : null; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (mode === "boot") skipBoot = true;
  if (!touchXY || e.target.id === "mute" || e.target === cmdEl) return;
  const t = e.changedTouches[0];
  const moved = t ? Math.hypot(t.clientX - touchXY[0], t.clientY - touchXY[1]) : 99;
  if (moved < 10) { e.preventDefault(); focusInput(); }
}, { passive: false });
// pointerup/click: only for mouse. Touch is handled above (preventDefault stops the synthetic mouse click).
document.addEventListener("pointerup", (e) => {
  if (e.pointerType === "touch" || e.target.id === "mute" || e.target === cmdEl) return;
  const sel = window.getSelection && window.getSelection().toString();
  if (!sel) focusInput();
});
document.addEventListener("click", (e) => {
  if (e.target.id === "mute" || e.pointerType === "touch") return;
  const sel = window.getSelection && window.getSelection().toString();
  if (!sel) focusInput();
});

boot().catch(e => { console.error(e); print("boot error: " + e.message, "err"); });
})();
</script>
