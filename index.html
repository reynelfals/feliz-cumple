function tokenize(s) {
  const out = []; let cur = "", q = null, has = false;
  for (let i = 0; i < s.length; i++) {
    let ch = s[i];
    if (q) { if (ch === q || (q === "'" && (ch === "‘" || ch === "’")) || (q === '"' && (ch === "“" || ch === "”"))) q = null; else cur += ch; continue; }
    if (ch === "‘" || ch === "’") ch = "'";
    if (ch === "“" || ch === "”") ch = '"';
    if (ch === "'" || ch === '"') { q = ch; has = true; continue; }
    if (ch === "\\" && i + 1 < s.length) { cur += s[++i]; has = true; continue; }
    if (/\s/.test(ch)) { if (cur || has) { out.push(cur); cur = ""; has = false; } continue; }
    cur += ch; has = true;
  }
  if (cur || has) out.push(cur);
  return out;
}
function splitPipes(s) {
  const parts = []; let cur = "", q = null;
  for (const ch of s) {
    if (q) { if (ch === q) q = null; cur += ch; continue; }
    if (ch === "'" || ch === '"') { q = ch; cur += ch; continue; }
    if (ch === "|") { parts.push(cur); cur = ""; continue; }
    cur += ch;
  }
  parts.push(cur);
  return parts.map(p => p.trim());
}
const lines = t => { const a = String(t).split("\n"); if (a.length && a[a.length - 1] === "") a.pop(); return a; };
const joinL = a => a.length ? a.join("\n") + "\n" : "";

function readArg(path, cmd) {
  const parts = resolve(path), n = nodeAt(parts);
  if (!n) return { err: `${cmd}: ${path}: No such file or directory` };
  if (n.locked || n.deny) return { err: `${cmd}: ${path}: Permission denied` };
  if (n.t === "d") return { err: `${cmd}: ${path}: Is a directory` };
  return { text: n.x || "", node: n };
}
function inputOf(files, stdin, cmd) {
  if (!files.length) return stdin == null ? { err: `${cmd}: falta el archivo (o úsalo en un pipe)` } : { text: stdin };
  let text = "";
  for (const f of files) { const r = readArg(f, cmd); if (r.err) return r; text += r.text; }
  return { text };
}

  const size = n.t === "d" ? 4096 : (n.x || "").length;

  return `${n.m} ${n.t === "d" ? 2 : 1} ${own.padEnd(8)} ${own.padEnd(8)} ${String(size).padStart(6)} ${n.d} ${name}${n.locked ? "  [LOCKED]" : ""}`;
}

function cmdLs(a) {
  const flags = a.filter(x => x.startsWith("-") && x.length > 1).join("");
  const long = flags.includes("l"), all = flags.includes("a");
  const targets = a.filter(x => !(x.startsWith("-") && x.length > 1));
  if (!targets.length) targets.push("");
  let out = "", err = "";
  for (const t of targets) {
    const parts = resolve(t), n = nodeAt(parts);
    const label = t || ".";
    if (!n) { err += `ls: cannot access '${label}': No such file or directory\n`; continue; }
    if (n.locked) { err += `ls: cannot open directory '${label}': Permission denied  (usa: unlock ${parts[parts.length - 1]})\n`; continue; }
    if (n.deny) { err += `ls: cannot open directory '${label}': Permission denied\n`; continue; }
    if (targets.length > 1 && n.t === "d") out += `${label}:\n`;
    if (n.t === "f") { out += (long ? lsLong(t, n) : t) + "\n"; continue; }
    let names = Object.keys(n.c).sort((x, y) => x.replace(/^\./, "").localeCompare(y.replace(/^\./, "")));
    if (!all) names = names.filter(x => !x.startsWith("."));
    if (long) {
      out += `total ${(names.length + (all ? 2 : 0)) * 4}\n`;
      if (all) { out += lsLong(".", n) + "\n"; out += lsLong("..", nodeAt(parts.slice(0, -1)) || n) + "\n"; }
      for (const nm of names) out += lsLong(nm, n.c[nm]) + "\n";
    } else {
      const shown = names.map(nm => n.c[nm].locked ? nm + "/🔒" : (n.c[nm].t === "d" ? nm + "/" : (n.c[nm].m.includes("x") ? nm + "*" : nm)));
      if (all) shown.unshift("./", "../");
      if (shown.length) out += shown.join("   ") + "\n";
    }
    if (targets.length > 1) out += "\n";
  }
  return { out: out.replace(/\n\n$/, "\n"), err: err.trimEnd() };
}
function nArg(a) {
  let n = 10; const rest = [];
  for (let i = 0; i < a.length; i++) {
    if (a[i] === "-n") n = parseInt(a[++i], 10);
    else if (/^-n\d+$/.test(a[i])) n = parseInt(a[i].slice(2), 10);
    else if (/^-\d+$/.test(a[i])) n = parseInt(a[i].slice(1), 10);
    else rest.push(a[i]);
  }
  return { n: isNaN(n) ? 10 : n, rest };
}

      fort.room = r.exits[k]; fort.flags["v_" + fort.room] = true;
      say(k === "reflejo" ? "Usted atraviesa el espejo como si fuera agua." : "Usted atraviesa sin dificultades.");
      fortLook(); break; }
    case "matar": case "asesinar": case "atacar": case "golpear": case "romper": {
      if (fort.room === "bestia" && obj.includes("bestia")) {
        if (fort.flags.won) { say("No puede matar a algo que ya no tiene vida."); break; }
        if (!fort.inv.includes("maza")) { say("Todos sus esfuerzos son en vano. Probablemente no esté usando el objeto indicado."); break; }
        fort.flags.won = true;
        say("Usted levanta la maza con las dos manos..."); say("AAAAARRRGGGGG!!!   CRASSSHHH!!!"); say("");
        say("La Bestia se desmorona. ¿Era la Bestia, o era la Fortaleza? Nadie lo sabrá.");
        say("Entre los escombros hay un papelito doblado:"); say("");
        say("   \"En las gradas del Latino, la sección de Industriales grita una cosa");
        say("    más que ninguna otra. Cuéntalas:  grep | cut | sort | uniq -c\"");
        say("");
        say("   *** 100% — homenaje a La Fortaleza de Merchise (Miguel Cepero, UCLV) ***");
        say("   (el papelito quedó en ~/papel_de_la_bestia.txt) — escriba SALIR");
        nodeAt(HOME).c["papel_de_la_bestia.txt"] = ffile("En las gradas del Latino, la sección de Industriales grita una cosa\nmás que ninguna otra. Cuéntalas:  grep | cut | sort | uniq -c\n\n— Homenaje a La Fortaleza de Merchise. Ganaste.\n", "-rw-r--r--", USER, "Oct 19 21:03");
      } else if (obj.includes("bestia")) say("La Bestia no está aquí.");
      else if (obj) say("¿Por qué hizo eso? No era necesario.");
      else say("¿Matar qué?");
      break; }
    default: say("No le comprendo.");
  }
  say(""); say("¿Qué desea hacer?");
  fortRender();
}

// ---------------------------------------------------------------- dispatcher
const INTERACTIVE = new Set(["cd", "unlock", "hint", "pista", "git", "vim", "vi", "nano", "fortaleza", "clear", "cls", "exit", "logout", "reset"]);
async function runLine(line) {
  const trimmed = line.replace(/\\\s+/g, " ").trim();   // tolerate pasted "\" line continuations
  if (!trimmed) return;
  if (/^:(q|wq|x)!?$/.test(trimmed)) return print("No estás en vim, asere. (pero buen reflejo)", "dim");
  const segs = splitPipes(trimmed);
  if (segs.some(s => !s)) return print("bash: syntax error near unexpected token `|'", "err");
  if (segs.length === 1) {
    const a = tokenize(segs[0]); const c = a.shift() || "";
    if (c.includes("/")) return cmdExec(c, a);
    switch (c.toLowerCase()) {
      case "cd": return cmdCd(a);
      case "unlock": return cmdUnlock(a);
      case "hint": case "pista": return cmdHint(a);
      case "git": return cmdGit(a);
      case "nano": print("nano? Aquí somos de vim. Abriendo vim…", "dim"); return cmdVim(a);
      case "vim": case "vi": return cmdVim(a);
      case "fortaleza": return cmdFortaleza();
      case "clear": case "cls": return clearScreen();
      case "exit": case "logout":
        print("logout", "dim"); print(""); cwd = HOME.slice(); loginFails = 0;
        mode = "login-user"; setPrompt(HOST + " login: "); return;
      case "reset":
        try { localStorage.removeItem(LS_KEY); } catch (e) {}
        print("Progreso borrado. Reiniciando…", "amber"); await sleep(500); location.reload(); return;
    }
  }
  let stdin = null;
  for (let i = 0; i < segs.length; i++) {
    const a = tokenize(segs[i]); const c = (a.shift() || "").toLowerCase();
    if (INTERACTIVE.has(c) || c.includes("/")) { print(`bash: ${c}: no se puede usar dentro de un pipe aquí`, "err"); return; }
    const fn = PIPE_CMDS[c];
    if (!fn) { print(`bash: ${c}: command not found`, "err"); if (segs.length === 1) print("(escribe 'help' para ver los comandos)", "dim"); return; }
    const r = fn(a, stdin);
    if (r.err) { print(r.err, "err"); if (!r.out) return; }
    stdin = r.out || "";
  }
  if (stdin) print(stdin.replace(/\n$/, ""));
}

// ---------------------------------------------------------------- tab completion
function complete() {
  const v = cmdEl.value, pos = cmdEl.selectionStart ?? v.length;
  const left = v.slice(0, pos), right = v.slice(pos);
  const word = left.match(/(\S*)$/)[1], before = left.slice(0, left.length - word.length);
  const isCmd = !before.trim() || /\|\s*$/.test(before);
  let cands = [];
  if (isCmd && !word.includes("/")) cands = COMMANDS.filter(c => c.startsWith(word.toLowerCase())).map(c => c + " ");
  else {
    const slash = word.lastIndexOf("/");
    const dirPart = slash >= 0 ? word.slice(0, slash + 1) : "", prefix = slash >= 0 ? word.slice(slash + 1) : word;
    const dn = nodeAt(resolve(dirPart || ""));
    if (dn && dn.t === "d" && !dn.locked && !dn.deny)
      cands = Object.keys(dn.c).filter(n => n.startsWith(prefix) && (prefix.startsWith(".") || !n.startsWith("."))).sort()
        .map(n => dirPart + n + (dn.c[n].t === "d" ? "/" : " "));
  }
  const put = s => { cmdEl.value = before + s + right; const p = (before + s).length; cmdEl.setSelectionRange(p, p); };
  if (!cands.length) { beep(220, 0.03); return; }
  if (cands.length === 1) return put(cands[0]);
  let common = cands[0];
  for (const c of cands) while (!c.startsWith(common)) common = common.slice(0, -1);
  if (common.length > word.length) return put(common);
  print(psEl.textContent + v);
  print(cands.map(c => { const t = c.trimEnd(); return t.endsWith("/") ? t.slice(0, -1).split("/").pop() + "/" : t.split("/").pop(); }).join("   "), "dim");
}

// ---------------------------------------------------------------- input handling
async function submit() {
  const v = cmdEl.value;
  switch (mode) {
    case "boot": case "busy": return;
    case "login-user":
      cmdEl.value = ""; print(psEl.textContent + v);
      loginUser = v; mode = "login-pass"; setPrompt("Password: ", true); return;
    case "login-pass":
      cmdEl.value = ""; print(psEl.textContent);
      return doLogin(loginUser, v);
    case "prompt": {
      cmdEl.value = "";
      print(psEl.textContent + (cmdEl.type === "password" ? "*".repeat(v.length) : v));
      const r = promptResolve; promptResolve = null; mode = "busy"; hidePrompt(); r(v); return;
    }
    case "vim": cmdEl.value = ""; return vimLine(v);
    case "fort": cmdEl.value = ""; return fortLine(v);
    case "shell": {
      cmdEl.value = "";
      print(psEl.textContent + v);
      if (v.trim() && history[history.length - 1] !== v) history.push(v);
      histIdx = -1; draft = "";
      mode = "busy"; hidePrompt();
      try { await runLine(v); }
      catch (e) { console.error(e); print("bday-sh: error interno: " + e.message, "err"); }
      if (mode === "busy" || mode === "prompt") mode = "shell";
      if (mode === "shell") setPrompt(shellPrompt());
      return;
    }
  }
}
function cancelLine() {
  if (mode === "prompt") {
    print(psEl.textContent + cmdEl.value + "^C", "dim"); cmdEl.value = "";
    const r = promptResolve; promptResolve = null; mode = "busy"; hidePrompt(); r(null); return;
  }
  if (mode === "vim") { cmdEl.value = ""; vim.msg = "Type  :qa!  and press <Enter> to abandon all changes and exit Vim"; vim.err = false; return vimRender(); }
  if (mode === "fort") { cmdEl.value = ""; return fortQuit("[fortaleza] ^C — Usted huye de la Fortaleza."); }
  if (mode === "shell" || mode === "login-user" || mode === "login-pass") {
    print(psEl.textContent + (mode === "login-pass" ? "" : cmdEl.value) + "^C"); cmdEl.value = ""; histIdx = -1;
    if (mode === "login-pass") { mode = "login-user"; setPrompt(HOST + " login: "); }
  }
}
cmdEl.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;          // IME / dead keys (´ + a = á) on Spanish layouts
  if (mode === "boot") { skipBoot = true; return; }
  const k = e.key;
  if (e.ctrlKey && !e.altKey && (k === "c" || k === "C")) {
    if (cmdEl.selectionStart !== cmdEl.selectionEnd) return; // let Ctrl+C copy a selection
    e.preventDefault(); return cancelLine();
  }
  if (e.ctrlKey && !e.altKey && (k === "l" || k === "L")) { e.preventDefault(); if (mode === "vim") return vimRender(); if (mode === "fort") return fortRender(); return clearScreen(); }
  if (e.ctrlKey && !e.altKey && (k === "u" || k === "U")) { e.preventDefault(); cmdEl.value = ""; return; }
  if (k === "Escape") { e.preventDefault(); if (mode === "vim" && vim.insert) { vim.insert = false; vimRender(); } return; }
  if (k === "Enter") { e.preventDefault(); return submit(); }
  if (k === "Tab") { e.preventDefault(); if (mode === "shell") complete(); return; }
  if (mode === "shell" && (k === "ArrowUp" || k === "ArrowDown")) {
    e.preventDefault();
    if (!history.length) return;
    if (k === "ArrowUp") { if (histIdx === -1) { draft = cmdEl.value; histIdx = history.length - 1; } else if (histIdx > 0) histIdx--; }
    else { if (histIdx === -1) return; histIdx++; if (histIdx >= history.length) { histIdx = -1; cmdEl.value = draft; return; } }
    cmdEl.value = history[histIdx];
    const end = cmdEl.value.length; cmdEl.setSelectionRange(end, end);
    return;
  }
  if (k.length === 1 && !e.ctrlKey && !e.metaKey) click();
});
// Some mobile keyboards send keyCode 229 / no usable keydown for Enter: the form submit catches it.
rowEl.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
document.addEventListener("keydown", (e) => {
  if (mode === "boot") { skipBoot = true; return; }
  if (document.activeElement !== cmdEl && !e.metaKey && !e.ctrlKey && !e.altKey) focusInput();
});
document.addEventListener("pointerdown", () => { if (mode === "boot") skipBoot = true; });
// Tap anywhere focuses the input (pointerup covers touch screens that don't synthesize click reliably)
document.addEventListener("pointerup", (e) => {
  if (e.target.id === "mute" || e.target === cmdEl) return;
  const sel = window.getSelection && window.getSelection().toString();
  if (!sel) focusInput();
});
// On touch screens a plain tap must not blur the input (that would close/reopen the phone keyboard):
// a tap (no drag, so scrolling still works) is consumed here and just focuses the input.
let touchXY = null;
document.addEventListener("touchstart", (e) => { const t = e.touches[0]; touchXY = t ? [t.clientX, t.clientY] : null; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (mode === "boot") skipBoot = true;
  if (!touchXY || e.target.id === "mute" || e.target === cmdEl) return;
  const t = e.changedTouches[0];
  const moved = t ? Math.hypot(t.clientX - touchXY[0], t.clientY - touchXY[1]) : 99;
  if (moved < 10) { e.preventDefault(); focusInput(); }
}, { passive: false });
document.addEventListener("click", (e) => {
  if (e.target.id === "mute") return;
  const sel = window.getSelection && window.getSelection().toString();
  if (!sel) focusInput();
});

boot().catch(e => { console.error(e); print("boot error: " + e.message, "err"); });
})();
</script>
