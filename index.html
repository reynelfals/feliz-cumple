// tokens: {v, q}  (q = was quoted)
function tokenize(s) {
  const out = []; let cur = "", q = null, has = false, quoted = false;
  for (let i = 0; i < s.length; i++) {
    let ch = s[i];
    if (q) { if (ch === q || (q === '"' && (ch === "“" || ch === "”")) || (q === "'" && (ch === "‘" || ch === "’"))) q = null; else cur += ch; continue; }
    if (ch === "“" || ch === "”") ch = '"';
    if (ch === "‘" || ch === "’") ch = "'";
    if (ch === '"' || ch === "'") { q = ch; has = true; quoted = true; continue; }
    if (/\s/.test(ch)) { if (cur || has) { out.push({ v: cur, q: quoted }); cur = ""; has = false; quoted = false; } continue; }
    cur += ch; has = true;
  }
  if (cur || has) out.push({ v: cur, q: quoted });
  return out;
}
function splitPipes(s) {
  const parts = []; let cur = "", q = null;
  for (const ch of s) {
    if (q) { if (ch === q || ch === "”" || ch === "’") q = null; cur += ch; continue; }
    if (ch === '"' || ch === "'" || ch === "“" || ch === "‘") { q = ch === "“" ? '"' : ch === "‘" ? "'" : ch; cur += ch; continue; }
    if (ch === "|") { parts.push(cur); cur = ""; continue; }
    cur += ch;
  }
  parts.push(cur);
  return parts.map(p => p.trim());
}
// pull "< file", "> file", ">> file" out of a segment (outside quotes)
function redirections(seg) {
  let out = "", q = null, rin = null, rout = null, app = false;
  for (let i = 0; i < seg.length; i++) {
    const ch = seg[i];
    if (q) { if (ch === q) q = null; out += ch; continue; }
    if (ch === '"' || ch === "'") { q = ch; out += ch; continue; }
    if (ch === "<" || ch === ">") {
      let j = i + 1; let ap = false;
      if (ch === ">" && seg[j] === ">") { ap = true; j++; }
      while (seg[j] === " ") j++;
      let k = j; while (k < seg.length && !/[\s<>|]/.test(seg[k])) k++;
      const target = seg.slice(j, k);
      if (ch === "<") rin = target; else { rout = target; app = ap; }
      i = k - 1; continue;
    }
    out += ch;
  }
  return { seg: out.trim(), rin, rout, app };
}
// split "CD\" "CD.." "DIR/W" "ECHO." into command + rest
function splitCmd(tok) {
  const m = tok.match(/^(CD|CHDIR|DIR|MD|MKDIR|RD|RMDIR|CLS|TYPE|VER|VOL|MEM|HELP)([\\\/.].*)$/i);
  if (m) return [m[1], m[2]];
  const e = tok.match(/^(ECHO)([.:])(.*)$/i);
  if (e) return [e[1], "\u0000" + e[3]];
  return [tok, null];
}

// ---------------------------------------------------------------- file I/O helpers
function readArg(path, cmd) {
  const r = mustResolve(path);
  if (r.err) return { err: r.err };

}
function inputOf(files, stdin, cmd) {

// ---------------------------------------------------------------- DIR
function dirCmd(a) {
  let wide = false, page = false, showA = false, bare = false, pathArg = "";
  for (const t of a) {
    const v = t.v, up = v.toUpperCase();
    if (up.startsWith("/")) {
      for (const ch of up.slice(1)) {
        if (ch === "W") wide = true; else if (ch === "P") page = true; else if (ch === "A") showA = true;
        else if (ch === "B") bare = true;
      }
    } else if (!pathArg) pathArg = v;
  }
  let dirDrive = drive, dirParts, pattern = "*.*";
  if (!pathArg) { dirParts = cwd.slice(); dirDrive = drive; }
  else {
    const lastSeg = pathArg.split(/[\\\/:]/).pop();
    const looksLikeFile = isWild(pathArg) || (lastSeg.includes(".") && !/^\.+$/.test(lastSeg));
    if (looksLikeFile) {
      const slash = Math.max(pathArg.lastIndexOf("\\"), pathArg.lastIndexOf("/"));
      pattern = (slash >= 0 ? pathArg.slice(slash + 1) : pathArg).toUpperCase();
      const dp = slash >= 0 ? pathArg.slice(0, slash) || "\\" : "";
      const rr = mustResolve(dp === "" ? "." : dp); if (rr.err) return { err: rr.err }; dirParts = rr.parts; dirDrive = rr.drive;
    } else { const rr = mustResolve(pathArg); if (rr.err) return { err: rr.err }; dirParts = rr.parts; dirDrive = rr.drive; }
  }
  const n = nodeAt(dirParts, dirDrive);
  if (!n) return { err: "File not found" };
  if (n.locked) return { err: "Access denied" };
  if (n.t !== "d") return { err: "File not found" };
  const re = wildRe(pattern);
  let names = Object.keys(n.c).filter(nm => re.test(nm)).sort((x, y) => {
    const xd = n.c[x].t === "d", yd = n.c[y].t === "d";
    if (xd !== yd) return xd ? -1 : 1;
    return x.localeCompare(y);
  });
  if (!showA) names = names.filter(nm => !n.c[nm].h && !n.c[nm].s);
  if (!names.length && pattern !== "*.*") return { err: "File not found" };
  if (bare) return { out: joinL(names), page };
  let o = ` Volume in drive ${dirDrive} is ${volLabel(dirDrive)}\n Directory of ${dosPath(dirParts, dirDrive)}\n\n`;
  const rows = [];
  for (const nm of names) {
    const c = n.c[nm];
    const [base, ext] = nm.includes(".") ? (() => { const i = nm.lastIndexOf("."); return [nm.slice(0, i), nm.slice(i + 1)]; })() : [nm, ""];
    const attrs = (c.h ? "H" : "") + (c.s ? "S" : "") + (c.r ? "R" : "") + (c.locked ? "L" : "");
    if (wide) {
      rows.push((c.t === "d" ? "[" + nm + "]" : nm).padEnd(13) + (c.locked ? "🔒" : ""));
    } else {
      const size = c.t === "d" ? "        <DIR>" : String(fileSize(c)).padStart(13);
      const tag = c.locked ? "  [LOCKED]" : (attrs ? "  " + attrs : "");
      o += `${base.padEnd(8)} ${ext.padEnd(3)} ${size} ${c.d || DOSDATE}${tag}\n`;
    }
  }
  if (wide) {
    for (let i = 0; i < rows.length; i += 5) o += rows.slice(i, i + 5).join(" ") + "\n";
  }
  const shown = names.length;
  const bytes = names.reduce((s, nm) => s + (n.c[nm].t === "f" ? fileSize(n.c[nm]) : 0), 0);
  o += `       ${String(shown).padStart(2)} file(s) ${fmtNum(bytes).padStart(14)} bytes\n`;
  o += `                      ${fmtNum(Math.max(0, FLOPPY - bytesUsed(dirDrive))).padStart(14)} bytes free\n`;
  return { out: o, page };
}

// debug declared in core
function cmdDebug(a) {
  let bytes = new Uint8Array(0), name = "";
  if (a[0]) {
    const r = readArg(a[0].v, "DEBUG");
    if (r.err) return print(r.err, "err");
    name = a[0].v.toUpperCase();
    // prefer hex payload if present, else raw text bytes
    const m = String(r.text).match(/[0-9a-fA-F]{8,}/);
    if (m && m[0].length >= 16) { let h = m.sort ? m.sort((x, y) => y.length - x.length)[0] : m[0]; if (h.length % 2) h = h.slice(0, -1); bytes = hexToBuf(h); }
    else bytes = te.encode(r.text);
  }
  debug = { bytes, name, ptr: 0 };
  mode = "debug";
  print("-");
  setPrompt("-");
}
function debugLine(line) {
  const t = line.trim().toUpperCase();
  if (!t || t === "Q" || t === "QUIT") { debug = null; mode = "shell"; setPrompt(shellPrompt()); return; }
  if (t.startsWith("D") || t === "") {
    const arg = (t.match(/^D\s*([0-9A-F]+)?/) || [])[1];
    const start = arg ? parseInt(arg, 16) : debug.ptr;          // ptr is a number, not a hex string
    if (start >= debug.bytes.length) {
      print(`(fin del archivo: ${debug.bytes.length} bytes = ${debug.bytes.length.toString(16).toUpperCase()}h — Q para salir, D 0 vuelve al inicio)`, "dim");
      setPrompt("-"); return;
    }
    let o = "";
    for (let row = 0; row < 8; row++) {
      const off = start + row * 16;
      if (off >= debug.bytes.length) break;
      let hex = "", asc = "";
      for (let i = 0; i < 16; i++) {
        const b = debug.bytes[off + i];
        if (b === undefined) { hex += "   "; asc += " "; }
        else { hex += b.toString(16).padStart(2, "0").toUpperCase() + (i === 7 ? "-" : " "); asc += (b >= 32 && b < 127) ? String.fromCharCode(b) : "."; }
      }
      o += (off & 0xFFFF).toString(16).padStart(4, "0").toUpperCase() + "  " + hex + " " + asc + "\n";
    }
    debug.ptr = start + 128;
    print(o.replace(/\n$/, ""));
  } else if (t.startsWith("?")) {
    print("DEBUG: D [addr hex] = dump 128 bytes (D otra vez = siguiente página) · Q = quit");
  } else print("Error");
  setPrompt("-");
}

async function cmdTpc(a) {

  if (!src) return print("Turbo Pascal  Compiler  Version 3.01A\nCopyright (C) 1983,85 Borland Intl.\n\nFatal: File name expected.", "err");
  const r = mustResolve(src);
  if (r.err) return print(r.err, "err");
  const n = nodeAt(r.parts, r.drive);
  if (!n || n.t !== "f") return print("Fatal: File not found (" + src + ").", "err");
  if (!/\.PAS$/i.test(r.parts[r.parts.length - 1])) return print("Fatal: Not a Pascal source (.PAS).", "err");
  print("Turbo Pascal  Compiler  Version 3.01A", "hi");
  print("Copyright (C) 1983,85 Borland Intl.");

  // floppy seek chatter

    const sys = typeof findOnPath === "function" ? findOnPath(bu, { skipCwd: true }) : null;
    if (sys && sys.node && sys.node.run && sys.node.run !== "compiled") {

}

  fortRender();

// ---------------------------------------------------------------- MORE pager
async function pageText(text) {
  const L = lines(text);
  const page = 23;
  if (L.length <= page) { print(text.replace(/\n$/, "")); return; }
  for (let i = 0; i < L.length; i += page) {
    print(L.slice(i, i + page).join("\n"));
    if (i + page >= L.length) break;
    const more = print("-- More --", "more");
    const key = await waitKey();
    more.remove();
    if (mode === "more") mode = "busy";
    if (key === "^C") { print("^C"); break; }
    if (key === "q" || key === "Q" || key === "Escape") break;
  }
}

// ---------------------------------------------------------------- PATH / basename command resolution
function cmdBasename(raw) {
  let s = String(raw).replace(/\//g, "\\");
  // strip drive "A:"
  const dm = s.match(/^[a-zA-Z]:(.*)$/);
  if (dm) s = dm[1] || "";
  const i = s.lastIndexOf("\\");
  let base = (i >= 0 ? s.slice(i + 1) : s);
  return base.toUpperCase().replace(/\.(EXE|COM|BAT)$/i, "");
}
function findOnPath(name, opts) {
  opts = opts || {};
  name = String(name).toUpperCase().replace(/\.(EXE|COM|BAT)$/i, "");
  const tryNames = [name + ".COM", name + ".EXE", name + ".BAT", name];
  if (name === "EDIT" || name === "EDITOR") tryNames.push("EDITOR.COM", "EDIT.COM");
  const dirs = [];
  if (!opts.skipCwd) dirs.push({ drive, parts: cwd.slice() });
  for (const p of (env.PATH || "").split(";")) {
    if (!p) continue;
    const r = resolve(p);
    if (r && !r.nodisk) dirs.push({ drive: r.drive, parts: r.parts });
  }
  if (diskIn.B) dirs.push({ drive: "B", parts: [] });
  let fallback = null; // file without usable .run (e.g. compiled stub) — only if nothing better
  for (const d of dirs) {
    const n = nodeAt(d.parts, d.drive); if (!n || n.t !== "d") continue;
    for (const tn of tryNames) {
      const f = n.c[tn];
      if (!f || f.t !== "f") continue;
      const hit = { parts: d.parts.concat(tn), node: f, name: tn, drive: d.drive };
      if (f.run && f.run !== "compiled") return hit; // real tool wins
      if (f.run && !fallback) fallback = hit;
    }
  }
  return fallback;
}
/** Resolve a command token (bare, relative, absolute, any case, with/without .EXE/.COM). */
function resolveCommand(rawCmd) {
  const base = cmdBasename(rawCmd);
  if (!base) return null;
  // 1) PATH / B: builtins by basename — wins over path-local .PAS stubs / compiled .COM
  const sys = findOnPath(base, { skipCwd: true });
  if (sys && sys.node.run && sys.node.run !== "compiled") return sys;
  // 2) Explicit path: resolve file at that location (ESTADIO in MARIETA, B:\FORTALEZ)
  const pathy = /[\\\/]/.test(rawCmd) || (/^[a-zA-Z]:/.test(rawCmd) && !/^[a-zA-Z]:$/i.test(rawCmd));
  if (pathy) {
    let r = mustResolve(rawCmd);
    if (r.nodisk) return { nodisk: r.nodisk };
    if (!r.err) {
      let n = nodeAt(r.parts, r.drive);
      if (!n && !/\.(COM|EXE|BAT)$/i.test(rawCmd)) {
        for (const ext of [".COM", ".EXE", ".BAT"]) {
          const r2 = mustResolve(rawCmd + ext);
          if (!r2.err) { const n2 = nodeAt(r2.parts, r2.drive); if (n2) { r = r2; n = n2; break; } }
        }
      }
      if (n && n.t === "f" && n.run) return { parts: r.parts, node: n, name: r.parts[r.parts.length - 1], drive: r.drive };
      if (n && n.t === "f" && /\.PAS$/i.test(r.parts[r.parts.length - 1]))
        return { pasOnly: r.parts[r.parts.length - 1] };
      if (n && n.t === "f") return { parts: r.parts, node: n, name: r.parts[r.parts.length - 1], drive: r.drive };
    }
  }
  // 3) cwd then PATH (.COM after TPC, ESTADIO when cwd=MARIETA)
  return findOnPath(base);
}

const INTERNAL = new Set(["CD","CHDIR","CLS","COPY","DATE","DEL","ERASE","DIR","ECHO","EXIT","GOTO","IF","MD","MKDIR",
  "PATH","PAUSE","PROMPT","RD","RMDIR","REN","RENAME","SET","SHIFT","TIME","TYPE","VER","VERIFY","VOL","CALL","REM"]);
const INTERACTIVE = new Set(["CD","CHDIR","UNLOCK","HINT","EDIT","QBASIC","DEBUG","FORTALEZ","FORTALEZA",
  "ATTRIB","COPY","DEL","ERASE","PKUNZIP","LOGIN","RESET","REBOOT","EXIT","TURBO","TPC","BEISBOL","MAPA","PROGRESO","STATUS"]);

async function runExternal(hit, a) {
  const run = hit.node.run;
  if (run === "fortaleza") { await ensureDisk("B"); return cmdFortaleza(); }
  if (run === "batgame") { await ensureDisk("B"); return cmdBatgame(); }
  if (run === "sqli") return runSqli(hit.node);
  if (run === "edit" || run === "qbasic") return editOpen(a[0] && a[0].v);
  if (run === "debug") return cmdDebug(a);
  if (run === "login") { loginFails = 0; return loginScreen(); }
  if (run === "unlock") return cmdUnlock(a);
  if (run === "hint") return cmdHint(a);
  if (run === "status") { const r = PIPE.STATUS(); print(r.out.replace(/\n$/, "")); return; }
  if (run === "reset") return cmdReboot();
  if (run === "pkunzip") return cmdPkunzip(a);
  if (run === "xor") { const r = PIPE.XOR(a, null); if (r.err) print(r.err, "err"); else if (r.out) print(r.out.replace(/\n$/, "")); return; }
  if (run === "more") { const r = PIPE.MORE(a, null); if (r.err) print(r.err, "err"); else if (r.out) await pageText(r.out); return; }
  if (run === "find") { const r = PIPE.FIND(a, null); if (r.err) print(r.err, "err"); else if (r.out) print(r.out.replace(/\n$/, "")); return; }
  if (run === "sort") { const r = PIPE.SORT(a, null); if (r.err) print(r.err, "err"); else if (r.out) print(r.out.replace(/\n$/, "")); return; }
  if (run === "mem") { const r = PIPE.MEM(a); print(r.out.replace(/\n$/, "")); return; }
  if (run === "attrib") return cmdAttrib(a);
  if (run === "help") { const r = PIPE.HELP(a); if (r.err) print(r.err, "err"); else if (r.out) await pageText(r.out); return; }
  if (run === "tree") { const r = PIPE.TREE(a); if (r.err) print(r.err, "err"); else print(r.out.replace(/\n$/, "")); return; }
  if (run === "format") { const r = PIPE.FORMAT(); print(r.err, "err"); return; }
  if (run === "doskey") { const r = PIPE.DOSKEY(); print(r.out.replace(/\n$/, "")); return; }
  if (run === "turbo") return cmdTurbo();
  if (run === "tpc") return cmdTpc(a);
  if (run === "compiled") return print("Normal termination of Pascal program.", "dim");
  if (run === "command") { print("The COMMAND shell is already loaded."); return; }
  if (run === "diskcopy" || run === "chkdsk") { print("Insert target diskette in drive B: and strike any key when ready"); return; }
  print("This program cannot be run in DOS mode.", "err");
}

// REBOOT / RESET / Ctrl+Alt+Supr — the ONLY way to wipe the saved session.
async function cmdReboot() {
  const a = await ask("¿Reiniciar la LTEL? Se perderá todo el progreso (S/N) ");
  if (a && /^\s*s/i.test(a)) {
    wipeSession();
    print("Reiniciando la LTEL-24...", "hi");
    for (let i = 0; i < 3; i++) beep(300 - i * 60, 0.06, "square", 0.02);
    await sleep(500); location.reload(); mode = "busy"; hidePrompt();
    return;
  }
  print("Reinicio cancelado. Todo sigue igual.", "dim");
}
async function runLine(line) {
  const trimmed = line.replace(/\\\s+/g, " ").trim();
  if (!trimmed) return;
  // support CMD1 & CMD2 sequencing (basic)
  if (!trimmed.includes("|") && trimmed.includes(" & ")) {
    for (const part of trimmed.split(/\s+&\s+/)) await runLine(part);
    return;
  }
  const segs = splitPipes(trimmed);
  if (segs.some(s => !s)) return print("Syntax error", "err");

  // single-segment interactive / internal
  if (segs.length === 1) {
    const rd = redirections(segs[0]);
    let toks = tokenize(rd.seg);
    if (!toks.length) return;
    // path-qualified: B:\FORTALEZ.EXE / .\ESTADIO / ESTADIO.EXE
    const rawCmd = toks[0].v;
    const [cmd0, glued] = splitCmd(rawCmd);
    if (glued != null) toks = [{ v: cmd0, q: false }, { v: glued, q: false }, ...toks.slice(1)];
    else toks = [{ v: cmd0, q: false }, ...toks.slice(1)];
    // /? help
    if (toks.some(t => t.v === "/?" || t.v === "-?")) {
      const r = PIPE.HELP([{ v: cmdBasename(toks[0].v) }]);
      if (r.err) print(r.err, "err"); else await pageText(r.out);
      return;
    }
    const C = cmdBasename(toks[0].v);
    const args = toks.slice(1);
    // input redirection for single commands
    let stdin = null;
    if (rd.rin) { const r = readArg(rd.rin, C); if (r.err) return print(r.err, "err"); stdin = r.text; }

    // bare drive letter
    if (/^[abAB]:$/.test(rawCmd)) return cmdCd([{ v: rawCmd, q: false }]);

    switch (C) {
      case "CD": case "CHDIR": return await cmdCd(args);
      case "UNLOCK": return cmdUnlock(args);
      case "HINT": case "PISTA": return cmdHint(args);
      case "EDIT": case "EDITOR": case "QBASIC": case "EDLIN": return editOpen(args[0] && args[0].v);
      case "TURBO": return cmdTurbo();
      case "TPC": return cmdTpc(args);
      case "DEBUG": return cmdDebug(args);
      case "FORTALEZ": case "FORTALEZA": await ensureDisk("B"); return cmdFortaleza();
      case "BEISBOL": await ensureDisk("B"); return cmdBatgame();
      case "MAPA": case "PROGRESO": case "STATUS": { const r = cmdMapa(); print(r.out.replace(/\n$/, "")); return; }
      case "ATTRIB": return cmdAttrib(args);
      case "COPY": return cmdCopy(args);
      case "DEL": case "ERASE": return cmdDel(args);
      case "PKUNZIP": return cmdPkunzip(args);
      case "LOGIN": return (loginFails = 0, loginScreen());
      case "RESET": case "REBOOT": return cmdReboot();
      case "EXIT":
        print(""); cwd = HOME.slice(); loginFails = 0; return loginScreen();
      case "CLS": return clearScreen();
      case "REM": return;
      case "XOR": { const r = PIPE.XOR(args, stdin); if (r.err) print(r.err, "err"); else if (r.out) print(r.out.replace(/\n$/, "")); return; }
    }
    // Builtin / path / PATH — basename maps to PATH tools even if invoked as A:\XOR.COM
    if (!INTERNAL.has(C) && !PIPE[C]) {
      let hit = resolveCommand(rawCmd);
      if (hit && hit.nodisk) { await ensureDisk(hit.nodisk); hit = resolveCommand(rawCmd); }
      if (hit && hit.pasOnly) return print("Compílalo antes:  TPC " + hit.pasOnly + "   (o TYPE para leerlo)", "err");
      if (hit && hit.node && hit.node.run) return runExternal(hit, args);
      if (hit && hit.node) return print("This program cannot be run in DOS mode.", "err");
      return print("Bad command or file name", "err");
    }
    // DIR/MEM/TYPE/… (PIPE) fall through to the pipeline runner below
  }

  // pipeline
  let stdin = null;
  for (let i = 0; i < segs.length; i++) {
    const rd = redirections(segs[i]);
    let toks = tokenize(rd.seg); if (!toks.length) return print("Syntax error", "err");
    const [cmd0, glued] = splitCmd(toks[0].v);
    if (glued != null) toks = [{ v: cmd0, q: false }, { v: glued, q: false }, ...toks.slice(1)];
    if (toks.some(t => t.v === "/?")) { const r = PIPE.HELP([{ v: toks[0].v }]); if (r.err) print(r.err, "err"); else await pageText(r.out); return; }
    const C = cmdBasename(toks[0].v);
    const args = toks.slice(1);
    if (INTERACTIVE.has(C)) return print(`Cannot use ${C} in a pipe here`, "err");
    if (rd.rin) { const r = readArg(rd.rin, C); if (r.err) return print(r.err, "err"); stdin = r.text; }
    let fn = PIPE[C];
    if (!fn) {
      const hit = findOnPath(toks[0].v);
      if (hit && hit.node.run && PIPE[hit.node.run.toUpperCase()]) fn = PIPE[hit.node.run.toUpperCase()];
      else if (hit && hit.node.run === "find") fn = PIPE.FIND;
      else if (hit && hit.node.run === "sort") fn = PIPE.SORT;
      else if (hit && hit.node.run === "more") fn = PIPE.MORE;
      else if (hit && hit.node.run === "xor") fn = PIPE.XOR;
      else if (hit && hit.node.run === "dir") fn = PIPE.DIR;
    }
    if (!fn) return print("Bad command or file name", "err");
    const r = fn(args, stdin);
    if (r.clear) clearScreen();
    if (r.err) { print(r.err, "err"); if (!r.out) return; }
    stdin = r.out || "";
    if (i === segs.length - 1) {
      if (rd.rout) {
        const rr = mustResolve(rd.rout); if (rr.err) return print(rr.err, "err");
        if (!userWritable(rr.parts, rr.drive)) return print("Access denied", "err");
        const parent = nodeAt(rr.parts.slice(0, -1), rr.drive);
        if (!parent) return print("Invalid directory", "err");
        parent.c[rr.parts[rr.parts.length - 1]] = { t: "f", d: GDATE, o: "noname", x: stdin, u: 1 };
      } else if (stdin) {
        if (r && r.page) await pageText(stdin);
        else print(stdin.replace(/\n$/, ""));
      }
    }
  }
}

function cmdBatgame() {

function batgameStart() {
  const app = $("batgame");
  const canvas = $("bat-canvas");
  if (!app || !canvas) return print("BEISBOL.EXE: error de video (Hercules).", "err");
  mode = "batgame";
  document.body.classList.add("appmode");
  app.classList.add("on");
  hidePrompt();
  const need = 3, pitches = 6;
  batgame = {
    canvas, ctx: canvas.getContext("2d"),
    need, pitches, hit: 0, pitch: 0, fails: 0, mercy: false,
    phase: "ready", // ready | flying | result | done
    ballX: 0, ballY: 0, t0: 0, window: 0, swinging: false, raf: 0,
    msg: "Batea cuando la bola esté en la zona clara. ESPACIO (o toca) para empezar",
  };
  resizeBatgame();
  window.addEventListener("resize", resizeBatgame);
  const swing = (e) => { if (e) e.preventDefault(); batgameSwing(); };
  batgame._swing = swing;
  batgame._key = (e) => {
    if (e.repeat) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); batgameSwing(); }
    if (e.key === "Escape" || e.key === "q" || e.key === "Q") batgameQuit(false);
  };
  canvas.addEventListener("pointerdown", swing);
  // defer: the Enter that launched BEISBOL is still bubbling and must not start the first pitch
  setTimeout(() => { if (batgame) document.addEventListener("keydown", batgame._key); }, 0);
  // e2e hooks
  window.__batgameAutoWin = () => batgameForceWin();
  window.__batgameInfo = () => batgame ? { phase: batgame.phase, state: batgame.state || 0, hit: batgame.hit, pitch: batgame.pitch } : null;
  window.__batgameMercy = () => { if (batgame) { batgame.fails = 99; batgameApplyMercy(); } };
  batgameDraw();               // waits in "ready": the first pitch comes on SPACE / tap
}

function resizeBatgame() {
  if (!batgame) return;
  const canvas = batgame.canvas;
  const wrap = $("batgame");
  const w = Math.max(280, wrap.clientWidth - 8);
  const h = Math.max(180, wrap.clientHeight - 28);
  canvas.width = w; canvas.height = h;
  batgameDraw();
}

function batgameApplyMercy() {
  if (!batgame || batgame.mercy) return;
  if (batgame.fails < 4) return;
  batgame.mercy = true;
  batgame.need = 2;
  batgame.msg = "MODO PRÁCTICA — más fácil. 2 cuadrangulares bastan.";
  beep(600, 0.08); beep(800, 0.08);
}

function batgameNextPitch() {
  if (!batgame) return;
  batgameApplyMercy();
  if (batgame.hit >= batgame.need) return batgameWin();
  if (batgame.pitch >= batgame.pitches) {
    batgame.msg = "Fin del inning — inténtalo de nuevo (SPACE)";
    batgame.phase = "ready";
    batgame.pitch = 0; batgame.hit = 0;
    batgame.fails++;
    batgameDraw();
    return;
  }
  batgame.pitch++;
  batgame.phase = "flying";
  batgame.swinging = false;
  batgame.t0 = performance.now();
  // sweet spot ~55–72% of flight; mercy widens
  const flight = batgame.mercy ? 1400 : 1000;
  batgame.flight = flight;
  batgame.sweet0 = batgame.mercy ? 0.40 : 0.52;
  batgame.sweet1 = batgame.mercy ? 0.85 : 0.72;
  cancelAnimationFrame(batgame.raf);
  const tick = (now) => {
    if (!batgame || batgame.phase !== "flying") return;
    batgame.state = Math.min(1, (now - batgame.t0) / batgame.flight);
    batgameDraw();
    if (batgame.state >= 1) {
      // missed
      batgame.phase = "result";
      batgame.msg = "STRIKE — swing más temprano (SPACE)";
      batgame.fails++;
      beep(120, 0.1, "sawtooth", 0.03);
      setTimeout(() => { if (batgame) batgameNextPitch(); }, 700);
      return;
    }
    batgame.raf = requestAnimationFrame(tick);
  };
  batgame.raf = requestAnimationFrame(tick);
  beep(400, 0.03, "square", 0.02);
}

function batgameSwing() {
  if (!batgame) return;
  if (batgame.phase === "ready") { batgameNextPitch(); return; }
  if (batgame.phase !== "flying" || batgame.swinging) return;
  batgame.swinging = true;
  const st = batgame.state;
  cancelAnimationFrame(batgame.raf);
  const ok = st >= batgame.sweet0 && st <= batgame.sweet1;
  batgame.phase = "result";
  if (ok) {
    batgame.hit++;
    batgame.msg = `¡CUADRANGULAR! ${batgame.hit}/${batgame.need}   (pitch ${batgame.pitch}/${batgame.pitches})`;
    beep(880, 0.06); setTimeout(() => beep(1175, 0.1), 80);
  } else {
    batgame.fails++;
    batgame.msg = st < batgame.sweet0 ? "Muy temprano" : "Muy tarde";
    beep(150, 0.1, "sawtooth", 0.03);
  }
  batgameDraw();
  setTimeout(() => { if (batgame) batgameNextPitch(); }, ok ? 650 : 750);
}

const BAT_PAL = { R:"#ff5555", r:"#aa0000", B:"#5555ff", b:"#0000aa", S:"#ffcc88", W:"#ffffff", G:"#aaaaaa", K:"#000000", N:"#aa5500", Y:"#ffff55" };
const BAT_SPR = {
  pitcher: [            // Santiago (rojo), en el box
    "...rrr...",
    "..RRRRR..",
    "...SSS...",
    "...SSS...",
    "..RWWWR..",
    ".WWWWWWW.",
    "S.WWWWW.S",
    "S.WWWWW.S",
    "..WWWWW..",
    "..rrrrr..",
    "..WW.WW..",
    "..WW.WW..",
    "..WW.WW..",
    "..KK.KK..",
  ],
  pitcherThrow: [
    "...rrr...S",
    "..RRRRR.S.",
    "...SSS.W..",
    "...SSSW...",
    "..RWWWR...",
    ".WWWWWW...",
    "S.WWWWW...",
    "S.WWWWW...",
    "..WWWWW...",
    "..rrrrr...",
    "..WW..WW..",
    ".WW....WW.",
    ".WW....WW.",
    ".KK....KK.",
  ],
  batter: [             // Industriales (azul), bate arriba
    "..........N.",
    ".........N..",
    "...bbb..N...",
    "..BBBBBN....",
    "...SSSS.....",
    "...SSS.S....",
    "..BWWWSS....",
    ".WWWWWW.....",
    ".WWWWWW.....",
    "..WWWW......",
    "..bbbb......",
    "..WW.WW.....",
    "..WW..WW....",
    ".WW....WW...",
    ".KK....KK...",
  ],
  batterSwing: [
    "............",
    "............",
    "...bbb......",
    "..BBBBB.....",
    "...SSSS.....",
    "...SSS......",
    "..BWWWSSNNNN",
    ".WWWWWW.....",
    ".WWWWWW.....",
    "..WWWW......",
    "..bbbb......",
    "..WW.WW.....",
    "..WW..WW....",
    ".WW....WW...",
    ".KK....KK...",
  ],
};
function batSprite(ctx, rows, x, y, s) {
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
    const c = BAT_PAL[rows[j][i]]; if (!c) continue;
    ctx.fillStyle = c; ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), Math.ceil(s), Math.ceil(s));
  }
}
function batgameDraw() {
  if (!batgame) return;
  const { ctx, canvas } = batgame;
  const W = canvas.width, H = canvas.height;
  ctx.imageSmoothingEnabled = false;
  const px = Math.max(3, Math.floor(Math.min(W / 110, H / 70)));   // chunky CGA pixel
  // sky / stands
  ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#0000aa"; ctx.fillRect(0, 0, W, H * 0.18);
  for (let x = 0, k = 0; x < W; x += px * 2, k++) {          // crowd
    ctx.fillStyle = ["#ffff55", "#ff5555", "#ffffff", "#55ffff", "#aa5500"][(k * 7 + (k >> 2)) % 5];
    ctx.fillRect(x, H * 0.12 + ((k % 3) * px) / 2, px, px);
  }
  ctx.fillStyle = "#555555"; ctx.fillRect(0, H * 0.18, W, px);  // wall
  // grass
  ctx.fillStyle = "#00aa00"; ctx.fillRect(0, H * 0.18 + px, W, H);
  for (let y = H * 0.18 + px; y < H; y += px * 4) { ctx.fillStyle = "#008800"; ctx.fillRect(0, y, W, px * 2); }
  // infield dirt diamond
  const cx = W * 0.5, home = H * 0.86, second = H * 0.30, half = Math.min(W * 0.30, (home - second) * 0.95);
  const mid = (home + second) / 2;
  ctx.fillStyle = "#aa5500";
  ctx.beginPath(); ctx.moveTo(cx, second - px * 3); ctx.lineTo(cx + half + px * 3, mid); ctx.lineTo(cx, home + px * 3); ctx.lineTo(cx - half - px * 3, mid); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#00aa00";
  ctx.beginPath(); ctx.moveTo(cx, second + px * 4); ctx.lineTo(cx + half - px * 5, mid); ctx.lineTo(cx, home - px * 5); ctx.lineTo(cx - half + px * 5, mid); ctx.closePath(); ctx.fill();
  // foul lines + bases
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(1, px / 2);
  ctx.beginPath(); ctx.moveTo(cx, home); ctx.lineTo(cx + half, mid); ctx.lineTo(cx, second); ctx.lineTo(cx - half, mid); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = "#ffffff";
  for (const [bx, by] of [[cx + half, mid], [cx, second], [cx - half, mid]]) ctx.fillRect(bx - px, by - px, px * 2, px * 2);
  ctx.fillRect(cx - px * 1.5, home - px, px * 3, px * 2);   // home plate
  // mound
  const moundY = mid + (home - mid) * 0.05;
  ctx.fillStyle = "#aa5500"; ctx.beginPath(); ctx.ellipse(cx, moundY, px * 7, px * 3, 0, 0, Math.PI * 2); ctx.fill();
  // pitcher (scaled smaller: further away) and batter
  const flying = batgame.phase === "flying" || batgame.phase === "result";
  const t = flying ? batgame.state : 0;
  const ps = px * 0.9;
  batSprite(ctx, t > 0 && t < 0.18 ? BAT_SPR.pitcherThrow : BAT_SPR.pitcher, cx - 4.5 * ps, moundY - 13 * ps, ps);
  const bs = px * 1.5;
  batSprite(ctx, batgame.swinging ? BAT_SPR.batterSwing : BAT_SPR.batter, cx - 13 * bs, home - 14.5 * bs, bs);
  // catcher squat behind plate
  ctx.fillStyle = "#555555"; ctx.fillRect(cx - px * 2, home + px * 1.5, px * 4, px * 3);
  // hit zone (always visible so "la zona clara" means something), then the ball
  const y0 = moundY - 10 * ps, y1 = home - 6 * bs;
  {
    const yA = y0 + (y1 - y0) * (batgame.sweet0 != null ? batgame.sweet0 : 0.52);
    const yB = y0 + (y1 - y0) * (batgame.sweet1 != null ? batgame.sweet1 : 0.72);
    ctx.fillStyle = batgame.mercy ? "rgba(255,255,85,0.30)" : "rgba(255,255,170,0.18)";
    ctx.fillRect(cx - px * 4, yA, px * 8, yB - yA);
  }
  if (flying) {
    const x = cx + Math.sin(t * Math.PI) * (W * 0.03) - t * px * 2;
    const y = y0 + (y1 - y0) * t;
    const r = px * (0.6 + t * 0.9);
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff5555"; ctx.fillRect(x - r * 0.5, y - px / 4, r, Math.max(1, px / 3));
  }
  // scoreboard (CGA)
  const fs = Math.max(12, Math.min(18, Math.floor(px * 4)));
  ctx.font = fs + "px monospace";
  ctx.fillStyle = "#000000"; ctx.fillRect(6, 4, fs * 11, fs * 2.6);
  ctx.strokeStyle = "#ffff55"; ctx.lineWidth = 1; ctx.strokeRect(6.5, 4.5, fs * 11, fs * 2.6);
  ctx.fillStyle = "#5555ff"; ctx.fillText("IND " + batgame.hit, 12, 4 + fs * 1.1);
  ctx.fillStyle = "#ff5555"; ctx.fillText("STG 0", 12 + fs * 4, 4 + fs * 1.1);
  ctx.fillStyle = "#ffff55"; ctx.fillText("PITCH " + batgame.pitch + "/" + batgame.pitches + " NEED " + batgame.need, 12, 4 + fs * 2.2);
  if (batgame.mercy) { ctx.fillStyle = "#ffff55"; ctx.fillText("PRÁCTICA", W - fs * 6, 4 + fs * 1.1); }
  ctx.fillStyle = "#000000"; ctx.fillRect(0, H - fs * 1.6, W, fs * 1.6);
  ctx.fillStyle = "#ffff55"; ctx.fillText(batgame.msg, 10, H - fs * 0.45);
}

async function batgameWin() {
  if (!batgame) return;
  batgame.phase = "done";
  batgame.msg = "¡GANASTE! Desbloqueando DIAMANTE…";
  batgameDraw();
  const ans = batgameAnswer();
  const st = GAME.stages.find(s => s.id === "s8");
  const prev = GAME.stages[GAME.stages.indexOf(st) - 1];
  let res = null;
  try { res = await tryAnswer(keys[prev.id], ans, st); } catch (e) { res = null; }
  const code = ans; // show after unlock path — printed as clave
  await sleep(400);
  batgameQuit(true);
  if (!res) {
    print("BEISBOL: victoria, pero el candado no respondió. Prueba UNLOCK DIAMANTE a mano.", "err");
    print("(la clave es lo que conectaste con el bate — 6 letras)", "dim");
    return;
  }
  if (!solved.has("s8")) {
    const payload = await openBlob(res.ki, st);
    keys[st.id] = res.ki; solved.add(st.id);
    mountPayload(st, payload);
    saveProgress();
  }
  for (const ln of dosBox(["BEISBOL.EXE - INDUSTRIALES GANAN", "CLAVE DEL DIAMANTE:  " + code.toUpperCase()], 34)) print(ln, "hi");
  print("✓ ACCESO CONCEDIDO: DIAMANTE\\", "hi");
  showProgress();
  print("(prueba: CD A:\\NONAME\\DIAMANTE & TYPE LEEME.TXT)", "dim");
}

function batgameForceWin() {
  if (!batgame) return;
  batgame.hit = batgame.need;
  batgameWin();
}

function batgameQuit(won) {
  if (!batgame) return;
  cancelAnimationFrame(batgame.raf);
  const canvas = batgame.canvas;
  canvas.removeEventListener("pointerdown", batgame._swing);
  document.removeEventListener("keydown", batgame._key);
  window.removeEventListener("resize", resizeBatgame);
  $("batgame").classList.remove("on");
  document.body.classList.remove("appmode");
  batgame = null;
  mode = "shell";
  if (!won) print("[BEISBOL] Abandonas el diamante. Santiago se ríe.", "dim");
  setPrompt(shellPrompt());
  delete window.__batgameAutoWin;
  delete window.__batgameMercy;
}

// ---------------------------------------------------------------- Tab completion (optional, DOS-style)
function complete() {
  const v = cmdEl.value, pos = cmdEl.selectionStart ?? v.length;
  const left = v.slice(0, pos), right = v.slice(pos);
  const word = left.match(/(\S*)$/)[1], before = left.slice(0, left.length - word.length);
  const isCmd = !before.trim() || /\|\s*$/.test(before) || /\s+&\s*$/.test(before);
  let cands = [];
  const CMDS = ["DIR","CD","TYPE","MORE","FIND","SORT","CLS","VER","MEM","ECHO","SET","PATH","ATTRIB","EDITOR","EDIT","DEBUG",
    "HELP","UNLOCK","HINT","STATUS","COPY","DEL","PKUNZIP","XOR","FORTALEZ","TREE","VOL","DOSKEY","TURBO","TPC","BEISBOL","MAPA","PROGRESO","RESET","REBOOT","EXIT"];
  if (isCmd && !word.includes("\\") && !word.includes("/")) {
    cands = CMDS.filter(c => c.startsWith(word.toUpperCase())).map(c => c + " ");
  } else {
    const slash = Math.max(word.lastIndexOf("\\"), word.lastIndexOf("/"));
    const dirPart = slash >= 0 ? word.slice(0, slash + 1) : "";
    const prefix = (slash >= 0 ? word.slice(slash + 1) : word).toUpperCase();
    const rr = mustResolve(dirPart || ".");
    const dn = rr.err ? null : nodeAt(rr.parts, rr.drive);
    if (dn && dn.t === "d" && !dn.locked)
      cands = Object.keys(dn.c).filter(n => n.startsWith(prefix) && !dn.c[n].h)
        .sort().map(n => dirPart + n + (dn.c[n].t === "d" ? "\\" : " "));
  }
  const put = s => { cmdEl.value = before + s + right; const p = (before + s).length; cmdEl.setSelectionRange(p, p); };
  if (!cands.length) { beep(220, 0.03); return; }
  if (cands.length === 1) return put(cands[0]);
  let common = cands[0];
  for (const c of cands) while (!c.startsWith(common)) common = common.slice(0, -1);
  if (common.length > word.length) return put(common);
  print(psEl.textContent + v);
  print(cands.map(c => c.trimEnd()).join("   "), "dim");
}

// ---------------------------------------------------------------- input
async function submit() {
  const v = cmdEl.value;
  switch (mode) {
    case "boot": case "busy": case "more": return;
    case "login-user":
      cmdEl.value = ""; print(psEl.textContent + v);
      loginUser = v; mode = "login-pass"; setPrompt("Contraseña: ", true); return;
    case "login-pass":
      cmdEl.value = ""; print(psEl.textContent);
      return doLogin(loginUser, v);
    case "prompt": {
      cmdEl.value = "";
      print(psEl.textContent + (cmdEl.type === "password" ? "*".repeat(v.length) : v));
      const r = promptResolve; promptResolve = null; mode = "busy"; hidePrompt(); r(v); return;
    }
    case "edit": cmdEl.value = ""; return editLine(v);
    case "debug": cmdEl.value = ""; print("-" + v); return debugLine(v);
    case "fort": cmdEl.value = ""; return fortLine(v);
    case "shell": {
      cmdEl.value = "";
      if (echoOn) print(psEl.textContent + v);
      if (v.trim() && history[history.length - 1] !== v) { history.push(v); noteHistory(v); }
      histIdx = -1; draft = "";
      mode = "busy"; hidePrompt();
      try { await runLine(v); }
      catch (e) { console.error(e); print("BDAY-OS: error interno: " + e.message, "err"); }
      if (mode === "busy" || mode === "prompt") mode = "shell";
      if (mode === "shell") setPrompt(shellPrompt());
      saveSession();
      return;
    }
  }
}
function cancelLine() {
  if (mode === "prompt") {
    print(psEl.textContent + cmdEl.value + "^C", "dim"); cmdEl.value = "";
    const r = promptResolve; promptResolve = null; mode = "busy"; hidePrompt(); r(null); return;
  }
  if (mode === "more") { const r = promptResolve; promptResolve = null; if (r) r("q"); return; }
  if (mode === "edit") { cmdEl.value = ""; return; }
  if (mode === "debug") { cmdEl.value = ""; print("^C"); debug = null; mode = "shell"; setPrompt(shellPrompt()); return; }
  if (mode === "fort") { cmdEl.value = ""; return fortQuit("[FORTALEZ] ^C — Usted huye de la Fortaleza."); }
  if (mode === "shell" || mode === "login-user" || mode === "login-pass") {
    print(psEl.textContent + (mode === "login-pass" ? "" : cmdEl.value) + "^C"); cmdEl.value = ""; histIdx = -1;
    if (mode === "login-pass") { mode = "login-user"; setPrompt("Usuario: "); }
  }
}
cmdEl.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (mode === "boot") { skipBoot = true; return; }
  const k = e.key;
  // EDIT: keyboard File menu (Alt+F, hotkeys, arrows + Enter, Esc)
  if (mode === "edit" && editMenuKey(e)) return;
  if (e.ctrlKey && !e.altKey && (k === "c" || k === "C")) {
    if (cmdEl.selectionStart !== cmdEl.selectionEnd) return;
    e.preventDefault(); return cancelLine();
  }
  if (e.ctrlKey && !e.altKey && (k === "l" || k === "L")) { e.preventDefault(); if (mode === "shell") clearScreen(); return; }
  if (e.ctrlKey && !e.altKey && (k === "u" || k === "U")) { e.preventDefault(); cmdEl.value = ""; return; }
  if (k === "Escape") {
    e.preventDefault();
    if (mode === "edit") { $("filemenu").classList.remove("on"); $("editdlg").classList.remove("on"); }
    cmdEl.value = ""; histIdx = -1; draft = "";            // DOS: Esc cancels the current line
    return;
  }
  if (k === "Enter") { e.preventDefault(); return submit(); }
  if (k === "Tab") { e.preventDefault(); if (mode === "shell") complete(); return; }
  if (k === "F3" && mode === "shell") {
    e.preventDefault();
    if (history.length) { cmdEl.value = history[history.length - 1]; const end = cmdEl.value.length; cmdEl.setSelectionRange(end, end); }
    return;
  }
  if (mode === "shell" && (k === "ArrowUp" || k === "ArrowDown")) {
    e.preventDefault();
    if (!history.length) return;
    if (k === "ArrowUp") { if (histIdx === -1) { draft = cmdEl.value; histIdx = history.length - 1; } else if (histIdx > 0) histIdx--; }
    else { if (histIdx === -1) return; histIdx++; if (histIdx >= history.length) { histIdx = -1; cmdEl.value = draft; return; } }
    cmdEl.value = history[histIdx];
    const end = cmdEl.value.length; cmdEl.setSelectionRange(end, end);
    return;
  }
  if (k.length === 1 && !e.ctrlKey && !e.metaKey) click();
});
rowEl.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
async function ctrlAltDel() {
  if (mode !== "shell") { beep(140, 0.08, "sawtooth", 0.03); return; }
  cmdEl.value = ""; print(psEl.textContent + "<Ctrl+Alt+Supr>", "dim");
  mode = "busy"; hidePrompt();
  await cmdReboot();
  if (mode === "busy" || mode === "prompt") { mode = "shell"; setPrompt(shellPrompt()); }
}
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.altKey && (e.key === "Delete" || e.key === "Del")) { e.preventDefault(); ctrlAltDel(); return; }
  if (mode === "boot") { skipBoot = true; return; }
  if (document.activeElement !== cmdEl && !e.metaKey && !e.ctrlKey && !e.altKey) focusInput();
});
document.addEventListener("pointerdown", () => { if (mode === "boot") skipBoot = true; });
let touchXY = null;
document.addEventListener("touchstart", (e) => { const t = e.touches[0]; touchXY = t ? [t.clientX, t.clientY] : null; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (mode === "boot") skipBoot = true;
  if (!touchXY || e.target.id === "mute" || e.target === cmdEl) return;
  const t = e.changedTouches[0];
  const moved = t ? Math.hypot(t.clientX - touchXY[0], t.clientY - touchXY[1]) : 99;
  if (moved < 10) { e.preventDefault(); focusInput(); }
}, { passive: false });
// pointerup/click: only for mouse. Touch is handled above (preventDefault stops the synthetic mouse click).
document.addEventListener("pointerup", (e) => {
  if (e.pointerType === "touch" || e.target.id === "mute" || e.target === cmdEl) return;
  const sel = window.getSelection && window.getSelection().toString();
  if (!sel) focusInput();
});
document.addEventListener("click", (e) => {
  if (e.target.id === "mute" || e.pointerType === "touch") return;
  const sel = window.getSelection && window.getSelection().toString();
  if (!sel) focusInput();
});

boot().catch(e => { console.error(e); print("boot error: " + e.message, "err"); });
})();
